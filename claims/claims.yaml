      Here the pass condition is interference only; the absolute leakage bar is
      replaced by G2's calibration-vs-test blowup ratio. Reason: under the
      energy criterion, choosing r to hold rho of a sample's energy forces
      leakage on that sample to (1 - rho), so an absolute leakage bar collapses
      into "is rho >= 0.95" - a restatement of the setting rather than a
      measurement. What stays informative is whether leakage GENERALISES and
      what it COSTS.
    effect_of_the_change: >
      MATERIAL, and reported in every run as G0. Under E1.1's original K2 the
      POWER-LAW stream still FAILS: its only workable retention is rho = 0.95,
      where leak_test is 0.0518 against a 0.05 bar. The reversal is therefore
      partly a criterion change and not purely a measurement change, and the
      run prints both verdicts so this is auditable rather than asserted.
    predicted: uncertain
    status: PASS
    result: results/e1_1b_energy_criterion.json
    finding: >
      All four streams pass, including power law (workable at rho=0.95, 28 free
      directions, interference 0.048) and the realistic domain mixture (workable
      at 0.95/0.99/0.999, 67/41/22 free directions). G2 passes everywhere -
      leakage blowup from calibration to test is ~1.0x, so the spectrum estimate
      generalises off its own sample. Capacity sweep across dim in {128,256,512}
      and 4-64 domains: the budget only goes empty at a fill ratio of 5.0, i.e.
      5x over-subscription. At every realistic ratio there is ample free rank.
    unextracted_finding_now_extracted: >
      The workable retention bands do NOT intersect. bimodal [0.99, 0.999],
      exponential [0.99, 0.999], power law [0.95], mixture [0.95, 0.99, 0.999]
      -> intersection EMPTY at a rank-8 request. Bimodal and exponential are
      unsafe at 0.95 (interference 0.066, 0.068); power law is unusable at 0.99
      (free rank 6). So rho cannot be a fleet-wide constant: it is either unsafe
      somewhere or has nothing to allocate somewhere.
      CONTINGENT on the requested rank - at rank 2 or 4 the intersection is
      non-empty at {0.99}; at rank 8 and 16 it is empty. And these are four
      synthetic shapes, not four measured regions.
      CONSEQUENCE, and it strengthens R1: if no fixed rho serves every region,
      rho must be searched per region against measured interference on fresh
      traffic - which IS R1. R1 is therefore not an alternative sitting beside
      the energy criterion, it is what makes the energy criterion operable. It
      is also cheap: interference is a projection against an activation buffer,
      not a counterfactual replay.
    partially_reversed_by: E1.1c
    reversal: >
      Both halves of this verdict are TRAFFIC-WEIGHTED. rank_for_energy sums
      energy over calibration queries drawn at Zipfian visit rates, and
      leakage_by_rank / interference_by_rank return a MEAN over the same
      distribution. So protection is allocated in proportion to frequency, a
      rare domain's subspace lands below the cut and is classified free, and the
      metric that should catch it averages over the distribution that made the
      domain rare. Asked per domain on equal-sized probe sets, 6/8, 12/16 and
      25/32 domains exceed the interference limit at rho = 0.95 while the
      traffic mean reads 0.043-0.058 and passes.
      The operating point must move to the tail-safe retention, rho = 0.999,
      where free rank is 18/128 and 17/128 - 13-14% of dimension against the
      ~50% reported here at rho = 0.95. "Empty only at 5x over-subscription" was
      measured at a retention that is not tail-safe and should not be quoted.
    consequence: >
      E1.1's failure does NOT survive the strongest faithful reading. The
      subspace budget is sound; Part II section A states it in a form
      (thresholding eigenvalues) that is ill-posed, while pointing at a form
      (cumulative energy) that is not. This demotes E1.1 from an architectural
      failure to a specification defect, and makes R1 a demonstrated fix rather
      than a sketch.

