  - id: E1.1b
    tier: L7
    claim: "the subspace budget works under the energy/GPM criterion (top-r by cumulative energy)"
    source: "Part II section A's own pointer to GPM: 'truncated SVD over a small activation buffer - what GPM actually does'"
    rig: A
    kill: "G1 no retention level yields free rank >= 8 at interference <= 5% on held-out traffic; G2 test leakage > 2x calibration leakage"
    kill_criterion_changed: >
