# -- rig bugs found so far, all of which changed a reported result ---------
#
# Kept in the ledger rather than only in git history, because the rate and the
# kind matter: every one of these produced a confident number first.
bugs:
  - id: B1
    where: e1_1_spectrum_knee.widest_plateau
    bug: "counted saturation regions (rank pinned at 1 or dim) as elasticity plateaus"
    effect: "credited a power-law spectrum with a 3.82-decade plateau it does not have"

  - id: B2
    where: world.Region.practice
    bug: "competence advanced once per cycle regardless of tasks allocated"
    effect: "a region starved to one task learned as fast as one given a hundred, hiding the entire cost of misallocated budget"

  - id: B3
    where: ledger.residual_influence
    bug: "measured whether weights CHANGED under substitution of the deleted value"
    effect: >
      reported zero leakage for a policy with 186 missing influence paths.
      Cached weights are constants - stale, not sensitive. Produced a confident
      PASS on the claim this plan most expected to fail, and was caught only
      because U1 and U2 contradicted each other.

  - id: B4
    where: spectrum.stream_domain_mixture
    bug: "re-drew qr(normal(...)) domain subspaces on every call"
    effect: >
      train and held-out sets came from unrelated subspaces, so 99% of train
      energy needed 37 directions while the same fraction of test energy needed
      127 of 128. This manufactured the headline "realistic traffic saturates
      the space, leaving 6 free directions" finding, which was reported and has
      now been withdrawn. The most consequential bug so far, and the only one
      that biased a result AGAINST the design.
    caught_by: >
      A capacity sweep added to check whether the result was an artifact of the
      chosen dimension. It was. Nothing in the original experiment would have
      surfaced it.

# -- repairs proposed by experiments, not yet adopted ----------------------
repairs:
  - id: R1
    from: E1.1, E1.1b
    proposal: >
      Restate the subspace budget in Part II section A using the energy
      criterion the design already points at - keep the top-r directions
      holding a chosen fraction rho of held-out feature energy - instead of
      thresholding eigenvalues at eps. Pick r on a calibration sample and
      measure on a fresh one.
    evidence: >
      DEMONSTRATED, not sketched. E1.1b: all four streams workable, including
      power law and the realistic domain mixture, with the free-rank budget
      only emptying at 5x over-subscription.
    status: demonstrated
    note: >
      This supersedes the original R1, which proposed a measured-perturbation
      allocation rule as a speculative replacement. That is still worth having
      as a belt-and-braces check at allocation time, but it is no longer needed
      to rescue the mechanism.

  - id: R2
    from: E1.4
    proposal: >
      Score gaps by reducible variance - the decline in variance attributable
      to prior practice - rather than by variance level.
    evidence: "passed A1 and A2 at zero competence cost in E1.4"
    open: "stability under noisy pass-rate estimates is untested"
    status: proposed

  - id: R3
    from: E0.2
    proposal: >
      Record adapter provenance as the transitive closure through the
      conditioning skill card, not just the entries a trajectory cited
      outright. One line in the recording policy.
    evidence: "eliminates all 186 unrecorded influence paths and all leakage in E0.2"
    open: >
      The simulated influence path is linear and additive. Whether real
      parametric carryover from card-conditioned rollouts is fully captured by
      set-closure over the card's sources is a Rig B question, and the honest
      answer may be that provenance bounds the leak rather than closing it.
    status: proposed

  - id: R4
    from: E4.2
    proposal: >
      Split the blast-radius boundary in two. SEAL harness code any verifier
      executes through (retrieval policy, dispatch, tool schemas, judge model,
      the promotion gate itself). PIN derived views by stamping each Assay run
      with the versions it ran against, reusing the L2 weight-version
      mechanism. And move gate thresholds - eps, eps_reg, noise_leeway - from
      the L9-editable list to the sealed list, since they are the promotion bar
      in everything but name.
    evidence: "E4.2 static reachability and injection"
    open: "sealing retrieval policy removes it from L9's search space, which is where SIA found scaffold edits actually pay. Cost of the seal is unmeasured."
    status: proposed

  - id: R5
    from: E3.3
    proposal: >
      Replace "maximize off-diagonal mass" with "minimize held-out predictive
      error of the induced T". Same data, same observation-grain tau rows, and
