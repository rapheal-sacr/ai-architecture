    status: FAIL
    result: results/e3_3_offdiagonal_degeneracy.json
    finding: >
      Confirmed, and worse than predicted. Off-diagonal mass is strictly
      monotone in fineness (0.0000 at 1 region to 0.9908 at 192), so its argmax
      is total atomisation - one region per signature, 0.8 measurements per
      cell. The planted 4-cluster truth scores 0.1957, near the bottom of the
      range: the objective does not merely fail to find the true structure, it
      ranks it as nearly the worst candidate. Splitting a region can only move
      mass off the diagonal and never onto it, so there is no opposing force.
      Replacement tested: score a partition by held-out predictive MSE of the T
      it induces. Bias and variance pull against each other and the argmin
      lands exactly on the planted 4 clusters.

