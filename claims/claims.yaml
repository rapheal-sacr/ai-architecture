# Machine-readable claim ledger for the WAM falsification plan.
#
# status: untested | running | PASS | FAIL | PARTIAL
# predicted: what this plan expects before running (pre-registration)
#
# Keeping this separate from PLAN.md so experiment runners can assert against
# it and so the pre-registered prediction cannot be quietly edited after a run
# without showing up in the diff.

meta:
  design_docs:
    - "Architecture Design/wam_L8_L9_ledger_anchored_self_improvement.md"     # Part I
    - "Architecture Design/wam_L8_L9_part2_mechanisms.md"                     # Part II
    - "Architecture Design/wam_L8_L9_part3_response_to_review.md"             # Part III
    - "Architecture Design/transformer_vs_write_ahead_memory.png"             # L0-L6
    - "Architecture Design/wam_L7_ledger_anchored_plasticity.png"             # L7
  rigs:
    A: "ledger simulator, no model, runs on the M2 in seconds to minutes"
    B: "small real model, MLX, <=3B 4-bit, 8 GB ceiling"
    C: "rented GPU, episodic, survivors only"

claims:

  # -- Root 0 - invariants -------------------------------------------------
  - id: E0.1
    tier: L7
    claim: "I4 - competence regenerates from provenance alone"
    source: "L7 card; Part II section G calls this untested"
    rig: A
    kill: "any non-tombstoned competence not returning within delta; or recompile cost O(ledger) with unbounded ledger"
    predicted: uncertain
    status: untested

  - id: E0.2
    tier: L7
    claim: "tombstone cascade reaches every adapter influenced by an entry"
    source: "L7 card - 'unlearning by construction rather than by approximation'"
    rig: A
    kill: "any adapter whose post-cascade weights differ from a clean recompile with the entry gone"
    predicted: FAIL
    predicted_reason: >
      Provenance is recorded entry->adapter, but Part I section 7 says the skill
      card generates the adapter's training set. The real path is
      entry -> card -> card-conditioned rollouts -> adapter. Unless provenance
      takes the transitive closure through those rollouts, parametric carryover
      survives the cascade and unlearning is approximate after all.
    status: PARTIAL
    result: results/e0_2_transitive_unlearning.json
    finding: >
      Under `direct` provenance - the literal reading of "the ledger entry IDs
      it was compiled from", where compilation sees rollouts rather than cards -
      recorded provenance omits influence paths that exist, and the cascade
      fires on 0.13 adapters per tombstone rather than 3.23. That a gap exists
      is established by argument, not by this run.
    retracted: >
      The reported transitive-arm result - "0 leaks, complete provenance, fixes
      it completely" - is WITHDRAWN as tautological. record_provenance(policy=
      "transitive") and true_influencers execute the same loop body, so U2 is
      X - X = the empty set for every world, seed and parameterisation. The arm
      could not have returned any other answer. What was demonstrated is that a
      two-hop influence model is closed under two-hop closure.
    also_invalid: >
      The 95.9% figure for `direct` is the difference between two code paths and
      its magnitude is set by how often this world's rollouts happen to cite
      card sources directly. It is a knob, not a measurement of the design.
    deeper_problems:
      - >
        true_influencers enumerates exactly two hop types, so any third path is
        invisible to the GROUND TRUTH as well as to both arms. Real third paths
        in the design: entry -> gap statistics -> challenger task distribution
        -> which rollouts exist; and entry -> retrieval ranking -> which card
        surfaced -> rollouts.
      - >
        Set membership is the wrong shape for parametric carryover. If a
        tombstoned entry shaped a card, the card would have been different, so
        EVERY rollout conditioned on it would have been different - not only the
        rollouts citing that entry.
    rebuild_required: >
      Ground truth must be computed functionally - perturb an entry, propagate
      through the world, observe which adapter weights move - so it is
      structurally independent of any provenance bookkeeping. Add at least one
      influence path neither policy captures.
    real_finding_owed: >
      The number nobody has priced: transitive cascade invalidates ~54% of
      adapters per tombstone, and adapters are hours-to-days per the design's own
      substrate table. That implies a tombstone-rate ceiling above which
      unlearning-by-construction is unaffordable. That ceiling decides whether
      L7's strongest claim is operationally real, and E0.2 should have produced
      it.
    measurement_note: >
      The first version tested whether weights *changed* under substitution of
      the deleted value and reported zero leakage despite 186 missing paths.
      Cached weights are constants; they are stale, not sensitive. Only
      comparison against a clean recompile detects the leak.

  - id: E0.2b
    tier: L7
    claim: "REBUILD of E0.2 with functionally-computed ground truth and a third influence path"
    source: "L7 card; rebuild mandated after E0.2's transitive arm was withdrawn as tautological"
    rig: A
    kill: "C1 transitive recall < 1.0 against functional ground truth; C2 sustainable tombstone rate < 1/day at any plausible recompile cost"
    predicted: uncertain
    status: FAIL
    result: results/e0_2b_influence_and_ceiling.json
    method: >
      Ground truth is never enumerated. An entry influences an adapter iff
      DELETING it moves that adapter's weights - the world run twice. That is
      the exact operation a tombstone performs and is independent of every
      provenance policy, including unenumerated ones. The world also adds a path
      no set-based closure can capture: rollouts retrieve their conditioning
      card by query similarity, so deleting an entry can hand a rollout to a
      DIFFERENT card. Provenance records the card that was selected; the card
      that would have been selected was never run.
    finding: >
      C1 fails. Transitive recall is 0.913, not 1.0 - it misses ~9% of adapters
      that deletion genuinely moves, and only 61% of tombstones get complete
      coverage (198 misses observed). The gap is exactly the retrieval path:
      87% of tombstones reassign at least one rollout to a different card, 3.41
      on average. Direct provenance recalls 0.126. Neither policy over-fires
      (0.00), so both are conservative in the wrong direction - they
      under-invalidate silently.
      C2 fails. True cascade is 69% of the fleet per tombstone; at 24h per
      adapter recompile with 4 in parallel that is 0.72 sustainable tombstones
      per day. The ceiling surface shows it falls below 1/day across much of
      the plausible space (25% cascade at 8h is 0.75/day).
    corrects: >
      R3 (transitive provenance) is INCOMPLETE, not a fix. This corrects the
      earlier claim that closure through the conditioning card "closes it
      completely" - which was the tautological result. No set-based closure can
      close it, because the missing dependency is on a counterfactual retrieval
      that was never executed.
    caveat: >
      The 69% cascade fraction is a property of this world's card overlap and
      rollout-to-adapter assignment, not of the design. The ceiling is therefore
      reported as a surface over cascade breadth and recompile cost rather than
      as a single number. What is structural is the shape: cost per tombstone
      scales linearly with both factors, and the design's own substrate table
      already fixes one of them at "hours-days".

  - id: E0.2c
    tier: L7 x L3
    claim: "the E0.2b deletion ceiling holds under policies that are not the worst available"
    source: "E0.2b promoted a ceiling to 'the one architectural finding'; this tests the policy it assumed"
    rig: A
    kill: "D1 disabling does not decouple compliance from recompile; D2 batching does not amortise at high cascade breadth; D3 cascade breadth is insensitive to card-bank duplication"
    predicted: uncertain
    status: PASS
    result: results/e0_2c_deletion_policies.json
    finding: >
      All three pass, which DEMOTES E0.2b's ceiling. E0.2b assumed the most
      expensive policy in the space - eager, per-tombstone, fully-recompiling,
      parallelism as the only relief - and folded three separable things into
      one number.
      D1: disabling an affected adapter is ~28,800x cheaper than recompiling it.
      Deletion CORRECTNESS is bought by disabling; recompilation restores
      COMPETENCE. Only the second is rate-limited, so E0.2b reported a
      service-quality limit as a correctness rate limit.
      D2: batching amortises hard and the union saturates at fleet size. At
      batch 16 throughput is 24 deletions/day at EVERY cascade breadth, versus
      1.57-2.53/day at batch 1. Batching does not merely help - it makes
      throughput independent of cascade breadth, because per-deletion cost is
      |union|/b x recompile and |union| is bounded by the fleet.
      D3: cascade breadth is a monotone function of card-bank duplication -
      63.1% at 1 card per entry rising to 98.8% at 6. So L3 admission control is
      a direct lever on L7 deletion cost.
    new_finding: >
      The first cross-tier design constraint in the programme, and it is a
      coupling rather than a limit: L3's card-bank admission threshold sets L7's
      deletion cost. Worth noting that SESA's stated cap of cosine <= 0.93 is
      too loose to bind it - mean card cosine of 0.779 already yields 98.8%
      cascade breadth, so the threshold as specified does not control deletion
      cost at all.
    corrects: >
      E0.2b's C2 should not have been promoted to "the one genuinely
      architectural finding". The identity capacity/(cascade x recompile) is
      sound arithmetic about a policy, and the policy was the most pessimistic
      one available.
    parameterisation_bug: >
      The first run of this experiment moved cascade breadth the WRONG WAY
      (68.3% -> 45.3% as overlap rose) because the overlap knob shrank the pool
      of entries feeding any card at all, rather than raising how many cards
      each entry feeds. Re-parameterised as an explicit multiplicity with
      participation held fixed. Rig bug B5.

  - id: E0.3
    tier: L8
    claim: "I3 no-compounding holds for synthetic experience without new machinery"
    source: "Part I section 2; Part III section 6.1"
    rig: A
    kill: "any promotion whose provenance closure contains only synthetic + inferred"
    predicted: uncertain
    predicted_reason: >
      Part III section 6.1 requires every L8 task to chain to an `observed`
      entry. Unclear whether that is enforceable when a task derives from a gap,
      which is a statistic over many entries rather than a pointer to one.
    status: untested

  - id: E0.4
    tier: cross
    claim: "I1 - every promoted capability resolves to observed entries"
    source: "Part I section 10, claim-level auditability"
    rig: A
    kill: "resolution fraction < 1.0"
    predicted: uncertain
    status: untested

  # -- Root 1 - estimator quality ------------------------------------------
  - id: E1.1
    tier: L7
    claim: "occupied rank = #{sigma_k > eps} is a computed constraint, not a guessed integer"
    source: "Part II section A"
    rig: A
    kill: "no decade-wide elasticity plateau (K1); or held-out leakage > 5% / free-write interference > 5% (K2)"
    predicted: FAIL
    status: PARTIAL
    result: results/e1_1_spectrum_knee.json
    scope: >
      This tests only the LITERAL formulation, #{sigma_k > eps}, with eps placed
      at the curvature knee. It is not a verdict on the subspace budget as a
      mechanism - see E1.1b, which tests the stronger reading and reverses the
      conclusion.
    finding: >
      Fails on 2 of 4 streams. Power law: no interior plateau, 29x rank swing
      across two decades of eps, 75% leakage. Bimodal - the design's own assumed
      shape - also fails, and instructively: leakage is quantised in units of
      one committed direction (4.2% of energy each) because eps is a hard cut,
      and the automatic knee-finder missed by two. Placing eps correctly
      requires already knowing the rank eps is being used to compute.
    withdrawn_finding_verbatim: >
      "Fails on 3 of 4 streams. Power-law: no plateau, 29x rank swing, 75%
      leakage. Realistic domain mixture: budget well posed but empty - 6 free
      directions of 128, so allocation deadlocks into permanent reclamation.
      Even the design's own assumed bimodal shape fails, and the failure is
      quantised in units of one committed direction (4.2% of energy each) -
      the auto-placed eps missed by two. No safety margin at the cut."
    withdrawn_status: FAIL
    superseded_by: [E1.1b, bugs.B4]
    why_kept: >
      I6 applied to this ledger. A refuted conclusion is valuable precisely
      because nothing references it any more, and the reversal is the single
      most informative record in this file. Overwriting the original text would
      leave a clean PASS with no visible sign that anything had moved.
    retracted: >
      The originally reported third failure - "realistic domain mixture leaves
      6 free directions of 128, so allocation deadlocks into permanent
      reclamation" - is WITHDRAWN. It was an artifact of stream_domain_mixture
      re-drawing its domain subspaces on every call, so train and held-out sets
      came from unrelated subspaces. With the generator fixed the domain mixture
      PASSES with 68 free directions and zero leakage. See bugs.B4.

  - id: E1.1b
    tier: L7
    claim: "the subspace budget works under the energy/GPM criterion (top-r by cumulative energy)"
    source: "Part II section A's own pointer to GPM: 'truncated SVD over a small activation buffer - what GPM actually does'"
    rig: A
    kill: "G1 no retention level yields free rank >= 8 at interference <= 5% on held-out traffic; G2 test leakage > 2x calibration leakage"
    kill_criterion_changed: >
      RE-REGISTERED. E1.1's K2 was `leakage <= 0.05 AND interference <= 0.05`.
      Here the pass condition is interference only; the absolute leakage bar is
      replaced by G2's calibration-vs-test blowup ratio. Reason: under the
      energy criterion, choosing r to hold rho of a sample's energy forces
      leakage on that sample to (1 - rho), so an absolute leakage bar collapses
      into "is rho >= 0.95" - a restatement of the setting rather than a
      measurement. What stays informative is whether leakage GENERALISES and
      what it COSTS.
    effect_of_the_change: >
      MATERIAL, and reported in every run as G0. Under E1.1's original K2 the
      POWER-LAW stream still FAILS: its only workable retention is rho = 0.95,
      where leak_test is 0.0518 against a 0.05 bar. The reversal is therefore
      partly a criterion change and not purely a measurement change, and the
      run prints both verdicts so this is auditable rather than asserted.
    predicted: uncertain
    status: PASS
    result: results/e1_1b_energy_criterion.json
    finding: >
      All four streams pass, including power law (workable at rho=0.95, 28 free
      directions, interference 0.048) and the realistic domain mixture (workable
      at 0.95/0.99/0.999, 67/41/22 free directions). G2 passes everywhere -
      leakage blowup from calibration to test is ~1.0x, so the spectrum estimate
      generalises off its own sample. Capacity sweep across dim in {128,256,512}
      and 4-64 domains: the budget only goes empty at a fill ratio of 5.0, i.e.
      5x over-subscription. At every realistic ratio there is ample free rank.
    unextracted_finding_now_extracted: >
      The workable retention bands do NOT intersect. bimodal [0.99, 0.999],
      exponential [0.99, 0.999], power law [0.95], mixture [0.95, 0.99, 0.999]
      -> intersection EMPTY at a rank-8 request. Bimodal and exponential are
      unsafe at 0.95 (interference 0.066, 0.068); power law is unusable at 0.99
      (free rank 6). So rho cannot be a fleet-wide constant: it is either unsafe
      somewhere or has nothing to allocate somewhere.
      CONTINGENT on the requested rank - at rank 2 or 4 the intersection is
      non-empty at {0.99}; at rank 8 and 16 it is empty. And these are four
      synthetic shapes, not four measured regions.
      CONSEQUENCE, and it strengthens R1: if no fixed rho serves every region,
      rho must be searched per region against measured interference on fresh
      traffic - which IS R1. R1 is therefore not an alternative sitting beside
      the energy criterion, it is what makes the energy criterion operable. It
      is also cheap: interference is a projection against an activation buffer,
      not a counterfactual replay.
    partially_reversed_by: E1.1c
    reversal: >
      Both halves of this verdict are TRAFFIC-WEIGHTED. rank_for_energy sums
      energy over calibration queries drawn at Zipfian visit rates, and
      leakage_by_rank / interference_by_rank return a MEAN over the same
      distribution. So protection is allocated in proportion to frequency, a
      rare domain's subspace lands below the cut and is classified free, and the
      metric that should catch it averages over the distribution that made the
      domain rare. Asked per domain on equal-sized probe sets, 6/8, 12/16 and
      25/32 domains exceed the interference limit at rho = 0.95 while the
      traffic mean reads 0.043-0.058 and passes.
      The operating point must move to the tail-safe retention, rho = 0.999,
      where free rank is 18/128 and 17/128 - 13-14% of dimension against the
      ~50% reported here at rho = 0.95. "Empty only at 5x over-subscription" was
      measured at a retention that is not tail-safe and should not be quoted.
    consequence: >
      E1.1's failure does NOT survive the strongest faithful reading. The
      subspace budget is sound; Part II section A states it in a form
      (thresholding eigenvalues) that is ill-posed, while pointing at a form
      (cumulative energy) that is not. This demotes E1.1 from an architectural
      failure to a specification defect, and makes R1 a demonstrated fix rather
      than a sketch.

  - id: E1.2
    tier: L7
    claim: "three lambda timescales with release requiring unanimity makes rank release safe"
    source: "Part III section 2"
    rig: A
    kill: "U1 unanimity starves while a faster rule does not; U2 short-only allocation is not caught downstream as the design claims"
    predicted: FAIL
    predicted_reason: >
      The long-lambda estimator releases almost nothing, so unanimity means
      near-zero release. Compounds with E1.1c's tail-safe free rank of 17-18.
    status: FAIL
    result: results/e1_2_lambda_unanimity.json
    finding: >
      Both criteria fail, and they fail in OPPOSITE directions, which is what
      makes this more than a tuning problem.
      U1' (re-registered, see below): the traffic-only budget is 69/128 free.
      Under unanimity the steady state collapses to 6.3 - the ratchet destroys
      91% of the budget - and requests starve at 0.711 against short_only's
      0.216, a ratio of 3.29x. Unanimity sustains 1.1 live adapters; short_only
      sustains 6.1. The safety rule adopted to protect the budget is what empties
      it.
      U2: allocating on the short estimator alone put 5222 direction-allocations
      into directions the LONG estimator still considered committed, and 57 of
      those sat in rare domains whose traffic mass is below 0.05 - invisible to a
      traffic-weighted non-regression check. So Part III section 2's stated
      justification for the asymmetry, "if the direction was actually committed,
      the promotion gate's non-regression test catches it", is FALSE exactly
      where it matters.
    why_this_is_architectural: >
      The two failures have opposite repairs. Tightening release (unanimity)
      starves the budget; loosening allocation (short-only) writes into committed
      directions that nothing downstream can see. No setting of the three-lambda
      rule is safe in both directions, and the design offers no third option. Not
      a threshold to retune.
    unifies_with_E1_1c: >
      U2's failure IS E1.1c's finding seen from the allocation side. E1.1c: a
      traffic-weighted energy cut classifies rare-domain subspaces as free.
      E1.2 U2: a traffic-weighted non-regression check cannot see interference in
      rare domains. One anisotropy, two symptoms - amendment item 10's point, now
      measured on both sides.
    kill_criterion_changed: >
      U1 was pre-registered in absolute form: unanimity >0.20 AND short_only
      <0.05. It does not fire, because the absolute form assumed short_only would
      be comfortable and it is not - it starves at 0.216 too, since the budget is
      tight for every rule. Re-registered as relative: U1' fails if unanimity
      starves >=1.5x the fastest rule. Ratio is 3.29x. Both verdicts print every
      run.
    unexplained: >
      The lambda_long sweep is NOT monotone even at 12 seeds - starve rate 0.530,
      0.647, 0.753, 0.711, 0.567 across lambda_long 0.98 to 0.9995, peaking at
      0.995. The spread exceeds the seed standard deviation (0.04-0.10) so it is
      probably real, but no mechanism is offered and it should not be used to pick
      lambda_long.

  - id: E1.3
    tier: L4
    claim: "posterior variance predicts realized error (calibration audit)"
    source: "Part III section 1 - the design's own recommended audit"
    rig: B
    kill: "Spearman rho < 0.5 between predicted variance and realized error"
    predicted: uncertain
    note: "E1.4 already shows rho = -0.99 for the epistemic reading in simulation"
    status: untested

  - id: E1.1c
    tier: L7
    claim: "E1.1b's PASS holds per domain, not only on the traffic average"
    source: "audit of E1.1b's aggregation"
    rig: A
    kill: "P1 any domain exceeds the interference limit at rho=0.95; P2 per-domain exposure monotone in rarity (Spearman <= -0.5); P3 reports the tail-safe retention and the free rank there"
    predicted: uncertain
    status: FAIL
    result: results/e1_1c_tail_domain_exposure.json
    finding: >
      P1 and P2 both FAIL. At rho = 0.95, 6/8, 12/16 and 25/32 domains exceed the
      interference bar while the traffic mean passes at 0.043-0.058.
      Spearman(traffic rate, domain leakage) is -1.000, -0.965, -0.917 - MONOTONE
      in rarity across all three configurations, so this is the criterion doing
      what it is defined to do rather than one unlucky domain.
      P3: tail-safe retention is rho = 0.999, free rank 18/128 and 17/128 at 16
      and 32 domains - 13-14% of dimension, against a rank-8 request. Room for
      roughly two adapters.
    why_it_matters_here_specifically: >
      L7's own admitted failure mode is coverage bias, and the rare-domain tail
      is exactly the long-tail personal knowledge the ledger exists to preserve.
      A budget safe on average and unsafe in the tail is unsafe for WAM's stated
      purpose specifically.
    both_obvious_repairs_fail: >
      R-a (union of every domain's own top-r) cuts worst leakage ~7x and still
      misses the interference bar. R-b (frequency-balanced R_t) barely moves it.
      The honest repair is that rho stops being a free parameter: set it from
      measured worst-domain interference. Same move as R1 and R7 - measure what
      happened rather than trust the bookkeeping rule. Affordable, since it needs
      domain labels only at calibration time.
    leakage_is_not_interference: >
      R-a cuts worst leakage 7x while leaving worst interference above the bar,
      because interference_by_rank writes into U_free[:, :r], the LARGEST sub-cut
      directions. G1 should always be the interference arm; any repair evaluated
      on leakage alone will look better than it is.
    falsifier_partly_succeeds: >
      Panel C sweeps domain-subspace overlap. At overlap 0.73 the tail-safe
      retention relaxes to 0.995 and free rank triples to 57. So the severity is
      a function of real per-region subspace overlap - a Rig B measurement, and
      the same activation pass PLAN.md section 3 already schedules.
    consequence_for_E1_2: >
      E1.2's predicted deadlock explicitly compounded with the retracted B4
      number. It now compounds with a LIVE one only ~3x larger: 17-18 free
      directions at the tail-safe point against a rank-8 request. E1.2 is the
      strongest remaining candidate for a genuine architectural failure and
      should be promoted.

  - id: E3.1b
    tier: L7
    claim: "E3.1's T4 inversion is caused by spillover per se"
    source: "audit of E3.1's T4 regime"
    rig: A
    kill: "S1 symmetric spillover also inverts the margin (T4 stands); S2 symmetric preserves while patch-only inverts (T4 is an asymmetry artifact); S3 reports the differential threshold"
    predicted: uncertain
    status: FAIL
    result: results/e3_1b_spillover_symmetry.json
    finding: >
      S2 CONFIRMED - T4 is an asymmetry artifact. Symmetric spillover of the same
      magnitude PRESERVES the margin and improves it: +0.176 at 0.02 and +0.210
      at 0.05, against +0.085 clean. Patch-only at 0.02 inverts to -0.010.
      Compositional-only acquisition goes 0.017 patch-only to 0.350 symmetric.
      S3: the ranking tolerates 0.030 of EXCESS patch spillover over skill
      spillover before inverting.
    corrects: >
      This partially REHABILITATES the architecture's central generalization
      claim. The condition Part II section B owes is differential, not absolute,
      and the Rig B measurement changes from a level to a paired difference -
      narrow adapter versus broad on the same probe set, which also removes the
      between-run variance that would dominate two separate level measurements.
    what_survives_unchanged: >
      Both arms collapse in absolute terms under patch-only spillover (3.9 and
      3.1 skills against 9.2 and 10.1 clean), and E3.1c Panel B locates the
      patch-only crossing at eps* = 0.015, so E3.1's chosen 0.02 sat just past it.

  - id: E3.1c
    tier: L7
    claim: "the transfer MATRIX earns anything over a one-line breadth penalty"
    source: "Root 3 justification test"
    rig: A
    kill: "N1 best breadth arm within 0.02 of net transfer in all regimes; N2 breadth beats transfer anywhere; N3 eps* outside [0,0.10]; N4 comp-only sensitive to tie-break"
    predicted: uncertain
    status: PARTIAL
    result: results/e3_1c_narrowness_baseline.json
    finding: >
      N1 ok and N2 ok - the transfer STATISTIC wins. The best breadth arm falls
      short by 0.093, 0.031 and 0.088 across the three regimes, so
      "d.sum() - d.max()" beats both target gain and a scale-free breadth
      penalty, and the one-line alternative loses.
      N3: eps* = 0.015 for patch-only spillover, inside the informative range.
      N4 FAILS: comp-only spread across tie-break rules is 0.550.
    the_distinction_that_matters: >
      No arm in E3.1 ever consults accumulated history. `transfer` scores
      d.sum() - d.max() on the CURRENT candidate's measured deltas. So the
      STATISTIC now has evidence; the MATRIX has none, in either direction. That
      matters because everything expensive hangs off the matrix: tau storage at
      observation grain, the partition objective, the censoring bias, and the L3
      compiled signature-ontology view. T's three remaining uses - L8 curriculum
      prior, L7 merge prior, diagonal-T as a memorisation diagnostic - are
      unevidenced and were never the stated reason for building it.

  - id: E1.4
    tier: L8
    claim: "L4's RLS error covariance is already an epistemic gap detector"
    source: "Part I section 3; Part II section A reading 2"
    rig: A
    kill: "noise regions capture > 3x fair share of practice budget (A1); or gate signal rho < 0.5 vs realized error (A2)"
    predicted: FAIL
    status: FAIL
    result: results/e1_4_aleatoric_magnet.json
    finding: >
      Posterior variance is epistemic + aleatoric and the two readings need
      opposite quantities. Predictive reading: one coin-flip region in twelve
      takes 51% of the practice budget (6.2x fair share), rising with horizon -
      an absorbing state, because 4p(1-p) peaks at p=0.5 where a coin flip
      lives permanently. Part III section 6.3's per-source cap only reduces
      this to 4.1x. Epistemic reading fixes the magnet but inverts the gate to
