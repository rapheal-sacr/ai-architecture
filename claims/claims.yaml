  # -- Root 1 - estimator quality ------------------------------------------
  - id: E1.1
    tier: L7
    claim: "occupied rank = #{sigma_k > eps} is a computed constraint, not a guessed integer"
    source: "Part II section A"
    rig: A
    kill: "no decade-wide elasticity plateau (K1); or held-out leakage > 5% / free-write interference > 5% (K2)"
    predicted: FAIL
    status: PARTIAL
    result: results/e1_1_spectrum_knee.json
    scope: >
      This tests only the LITERAL formulation, #{sigma_k > eps}, with eps placed
      at the curvature knee. It is not a verdict on the subspace budget as a
      mechanism - see E1.1b, which tests the stronger reading and reverses the
      conclusion.
    finding: >
      Fails on 2 of 4 streams. Power law: no interior plateau, 29x rank swing
      across two decades of eps, 75% leakage. Bimodal - the design's own assumed
      shape - also fails, and instructively: leakage is quantised in units of
      one committed direction (4.2% of energy each) because eps is a hard cut,
      and the automatic knee-finder missed by two. Placing eps correctly
      requires already knowing the rank eps is being used to compute.
    withdrawn_finding_verbatim: >
      "Fails on 3 of 4 streams. Power-law: no plateau, 29x rank swing, 75%
      leakage. Realistic domain mixture: budget well posed but empty - 6 free
      directions of 128, so allocation deadlocks into permanent reclamation.
      Even the design's own assumed bimodal shape fails, and the failure is
      quantised in units of one committed direction (4.2% of energy each) -
      the auto-placed eps missed by two. No safety margin at the cut."
    withdrawn_status: FAIL
    superseded_by: [E1.1b, bugs.B4]
