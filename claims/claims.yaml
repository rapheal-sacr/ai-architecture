  # -- Root 1 - estimator quality ------------------------------------------
  - id: E1.1
    tier: L7
    claim: "occupied rank = #{sigma_k > eps} is a computed constraint, not a guessed integer"
    source: "Part II section A"
    rig: A
    kill: "no decade-wide elasticity plateau (K1); or held-out leakage > 5% / free-write interference > 5% (K2)"
    predicted: FAIL
    status: PARTIAL
    result: results/e1_1_spectrum_knee.json
    scope: >
      This tests only the LITERAL formulation, #{sigma_k > eps}, with eps placed
      at the curvature knee. It is not a verdict on the subspace budget as a
      mechanism - see E1.1b, which tests the stronger reading and reverses the
      conclusion.
    finding: >
      Fails on 2 of 4 streams. Power law: no interior plateau, 29x rank swing
      across two decades of eps, 75% leakage. Bimodal - the design's own assumed
      shape - also fails, and instructively: leakage is quantised in units of
      one committed direction (4.2% of energy each) because eps is a hard cut,
      and the automatic knee-finder missed by two. Placing eps correctly
      requires already knowing the rank eps is being used to compute.
    withdrawn_finding_verbatim: >
      "Fails on 3 of 4 streams. Power-law: no plateau, 29x rank swing, 75%
      leakage. Realistic domain mixture: budget well posed but empty - 6 free
      directions of 128, so allocation deadlocks into permanent reclamation.
      Even the design's own assumed bimodal shape fails, and the failure is
      quantised in units of one committed direction (4.2% of energy each) -
      the auto-placed eps missed by two. No safety margin at the cut."
    withdrawn_status: FAIL
    superseded_by: [E1.1b, bugs.B4]
    why_kept: >
      I6 applied to this ledger. A refuted conclusion is valuable precisely
      because nothing references it any more, and the reversal is the single
      most informative record in this file. Overwriting the original text would
      leave a clean PASS with no visible sign that anything had moved.
    retracted: >
      The originally reported third failure - "realistic domain mixture leaves
      6 free directions of 128, so allocation deadlocks into permanent
      reclamation" - is WITHDRAWN. It was an artifact of stream_domain_mixture
      re-drawing its domain subspaces on every call, so train and held-out sets
      came from unrelated subspaces. With the generator fixed the domain mixture
      PASSES with 68 free directions and zero leakage. See bugs.B4.

  - id: E1.1b
    tier: L7
    claim: "the subspace budget works under the energy/GPM criterion (top-r by cumulative energy)"
    source: "Part II section A's own pointer to GPM: 'truncated SVD over a small activation buffer - what GPM actually does'"
    rig: A
    kill: "G1 no retention level yields free rank >= 8 at interference <= 5% on held-out traffic; G2 test leakage > 2x calibration leakage"
    kill_criterion_changed: >
      RE-REGISTERED. E1.1's K2 was `leakage <= 0.05 AND interference <= 0.05`.
      Here the pass condition is interference only; the absolute leakage bar is
      replaced by G2's calibration-vs-test blowup ratio. Reason: under the
      energy criterion, choosing r to hold rho of a sample's energy forces
      leakage on that sample to (1 - rho), so an absolute leakage bar collapses
      into "is rho >= 0.95" - a restatement of the setting rather than a
      measurement. What stays informative is whether leakage GENERALISES and
      what it COSTS.
    effect_of_the_change: >
      MATERIAL, and reported in every run as G0. Under E1.1's original K2 the
      POWER-LAW stream still FAILS: its only workable retention is rho = 0.95,
      where leak_test is 0.0518 against a 0.05 bar. The reversal is therefore
      partly a criterion change and not purely a measurement change, and the
      run prints both verdicts so this is auditable rather than asserted.
    predicted: uncertain
    status: PASS
    result: results/e1_1b_energy_criterion.json
    finding: >
      All four streams pass, including power law (workable at rho=0.95, 28 free
      directions, interference 0.048) and the realistic domain mixture (workable
      at 0.95/0.99/0.999, 67/41/22 free directions). G2 passes everywhere -
      leakage blowup from calibration to test is ~1.0x, so the spectrum estimate
      generalises off its own sample. Capacity sweep across dim in {128,256,512}
      and 4-64 domains: the budget only goes empty at a fill ratio of 5.0, i.e.
      5x over-subscription. At every realistic ratio there is ample free rank.
    unextracted_finding_now_extracted: >
      The workable retention bands do NOT intersect. bimodal [0.99, 0.999],
      exponential [0.99, 0.999], power law [0.95], mixture [0.95, 0.99, 0.999]
      -> intersection EMPTY at a rank-8 request. Bimodal and exponential are
      unsafe at 0.95 (interference 0.066, 0.068); power law is unusable at 0.99
      (free rank 6). So rho cannot be a fleet-wide constant: it is either unsafe
      somewhere or has nothing to allocate somewhere.
      CONTINGENT on the requested rank - at rank 2 or 4 the intersection is
      non-empty at {0.99}; at rank 8 and 16 it is empty. And these are four
      synthetic shapes, not four measured regions.
      CONSEQUENCE, and it strengthens R1: if no fixed rho serves every region,
      rho must be searched per region against measured interference on fresh
      traffic - which IS R1. R1 is therefore not an alternative sitting beside
      the energy criterion, it is what makes the energy criterion operable. It
      is also cheap: interference is a projection against an activation buffer,
      not a counterfactual replay.
    consequence: >
      E1.1's failure does NOT survive the strongest faithful reading. The
      subspace budget is sound; Part II section A states it in a form
      (thresholding eigenvalues) that is ill-posed, while pointing at a form
      (cumulative energy) that is not. This demotes E1.1 from an architectural
      failure to a specification defect, and makes R1 a demonstrated fix rather
      than a sketch.

  - id: E1.2
    tier: L7
    claim: "three lambda timescales with release requiring unanimity makes rank release safe"
    source: "Part III section 2"
