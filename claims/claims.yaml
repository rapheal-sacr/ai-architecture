      comfortably while the mechanism satisfying it is wrong in all three ways.
      Part III section 0's warning is about where improvement RATE is
      bottlenecked, not about where specification errors live.

    three_errors_corrected_here: >
      (i) union_size was LINEAR in batch and clipped at fleet. Adapters are
      touched independently, so the union saturates EXPONENTIALLY,
      fleet*(1-(1-beta)^b) - at beta 0.1 and batch 10 the linear form claimed the
      whole fleet where the true value is 65%. It overstated C3's cost most
      severely in the low-breadth regime, exactly where feasibility lives.
      (ii) batch_window was evaluated at the SATURATED union, pinning cascade
