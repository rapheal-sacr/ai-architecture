# Machine-readable claim ledger for the WAM falsification plan.
#
# status: untested | running | PASS | FAIL | PARTIAL
# predicted: what this plan expects before running (pre-registration)
#
# Keeping this separate from PLAN.md so experiment runners can assert against
# it and so the pre-registered prediction cannot be quietly edited after a run
# without showing up in the diff.

meta:
  design_docs:
    - "Architecture Design/wam_L8_L9_ledger_anchored_self_improvement.md"     # Part I
    - "Architecture Design/wam_L8_L9_part2_mechanisms.md"                     # Part II
    - "Architecture Design/wam_L8_L9_part3_response_to_review.md"             # Part III
    - "Architecture Design/transformer_vs_write_ahead_memory.png"             # L0-L6
    - "Architecture Design/wam_L7_ledger_anchored_plasticity.png"             # L7
  rigs:
    A: "ledger simulator, no model, runs on the M2 in seconds to minutes"
    B: "small real model, MLX, <=3B 4-bit, 8 GB ceiling"
    C: "rented GPU, episodic, survivors only"

claims:

  # -- Root 0 - invariants -------------------------------------------------
  - id: E0.1
    tier: L7
    claim: "I4 - competence regenerates from provenance alone"
    source: "L7 card; Part II section G calls this untested"
    rig: A
    kill: "any non-tombstoned competence not returning within delta; or recompile cost O(ledger) with unbounded ledger"
    predicted: uncertain
    status: untested

  - id: E0.2
    tier: L7
    claim: "tombstone cascade reaches every adapter influenced by an entry"
    source: "L7 card - 'unlearning by construction rather than by approximation'"
    rig: A
    kill: "any adapter whose post-cascade weights differ from a clean recompile with the entry gone"
    predicted: FAIL
    predicted_reason: >
      Provenance is recorded entry->adapter, but Part I section 7 says the skill
      card generates the adapter's training set. The real path is
      entry -> card -> card-conditioned rollouts -> adapter. Unless provenance
      takes the transitive closure through those rollouts, parametric carryover
      survives the cascade and unlearning is approximate after all.
    status: PARTIAL
    result: results/e0_2_transitive_unlearning.json
    finding: >
      Under `direct` provenance - the literal reading of "the ledger entry IDs
      it was compiled from", where compilation sees rollouts rather than cards -
      recorded provenance omits influence paths that exist, and the cascade
      fires on 0.13 adapters per tombstone rather than 3.23. That a gap exists
      is established by argument, not by this run.
    retracted: >
      The reported transitive-arm result - "0 leaks, complete provenance, fixes
      it completely" - is WITHDRAWN as tautological. record_provenance(policy=
      "transitive") and true_influencers execute the same loop body, so U2 is
      X - X = the empty set for every world, seed and parameterisation. The arm
      could not have returned any other answer. What was demonstrated is that a
      two-hop influence model is closed under two-hop closure.
    also_invalid: >
      The 95.9% figure for `direct` is the difference between two code paths and
      its magnitude is set by how often this world's rollouts happen to cite
      card sources directly. It is a knob, not a measurement of the design.
    deeper_problems:
      - >
        true_influencers enumerates exactly two hop types, so any third path is
        invisible to the GROUND TRUTH as well as to both arms. Real third paths
        in the design: entry -> gap statistics -> challenger task distribution
        -> which rollouts exist; and entry -> retrieval ranking -> which card
        surfaced -> rollouts.
      - >
        Set membership is the wrong shape for parametric carryover. If a
        tombstoned entry shaped a card, the card would have been different, so
        EVERY rollout conditioned on it would have been different - not only the
        rollouts citing that entry.
    rebuild_required: >
      Ground truth must be computed functionally - perturb an entry, propagate
      through the world, observe which adapter weights move - so it is
      structurally independent of any provenance bookkeeping. Add at least one
      influence path neither policy captures.
    real_finding_owed: >
      The number nobody has priced: transitive cascade invalidates ~54% of
      adapters per tombstone, and adapters are hours-to-days per the design's own
      substrate table. That implies a tombstone-rate ceiling above which
      unlearning-by-construction is unaffordable. That ceiling decides whether
      L7's strongest claim is operationally real, and E0.2 should have produced
      it.
    measurement_note: >
      The first version tested whether weights *changed* under substitution of
      the deleted value and reported zero leakage despite 186 missing paths.
      Cached weights are constants; they are stale, not sensitive. Only
      comparison against a clean recompile detects the leak.

  - id: E0.2b
    tier: L7
    claim: "REBUILD of E0.2 with functionally-computed ground truth and a third influence path"
    source: "L7 card; rebuild mandated after E0.2's transitive arm was withdrawn as tautological"
    rig: A
    kill: "C1 transitive recall < 1.0 against functional ground truth; C2 sustainable tombstone rate < 1/day at any plausible recompile cost"
    predicted: uncertain
    status: FAIL
    result: results/e0_2b_influence_and_ceiling.json
    method: >
      Ground truth is never enumerated. An entry influences an adapter iff
      DELETING it moves that adapter's weights - the world run twice. That is
      the exact operation a tombstone performs and is independent of every
      provenance policy, including unenumerated ones. The world also adds a path
      no set-based closure can capture: rollouts retrieve their conditioning
      card by query similarity, so deleting an entry can hand a rollout to a
      DIFFERENT card. Provenance records the card that was selected; the card
      that would have been selected was never run.
    finding: >
      C1 fails. Transitive recall is 0.913, not 1.0 - it misses ~9% of adapters
      that deletion genuinely moves, and only 61% of tombstones get complete
      coverage (198 misses observed). The gap is exactly the retrieval path:
      87% of tombstones reassign at least one rollout to a different card, 3.41
      on average. Direct provenance recalls 0.126. Neither policy over-fires
      (0.00), so both are conservative in the wrong direction - they
      under-invalidate silently.
      C2 fails. True cascade is 69% of the fleet per tombstone; at 24h per
      adapter recompile with 4 in parallel that is 0.72 sustainable tombstones
      per day. The ceiling surface shows it falls below 1/day across much of
      the plausible space (25% cascade at 8h is 0.75/day).
    corrects: >
      R3 (transitive provenance) is INCOMPLETE, not a fix. This corrects the
      earlier claim that closure through the conditioning card "closes it
      completely" - which was the tautological result. No set-based closure can
      close it, because the missing dependency is on a counterfactual retrieval
      that was never executed.
    caveat: >
      The 69% cascade fraction is a property of this world's card overlap and
      rollout-to-adapter assignment, not of the design. The ceiling is therefore
      reported as a surface over cascade breadth and recompile cost rather than
      as a single number. What is structural is the shape: cost per tombstone
      scales linearly with both factors, and the design's own substrate table
      already fixes one of them at "hours-days".

  - id: E0.2c
    tier: L7 x L3
    claim: "the E0.2b deletion ceiling holds under policies that are not the worst available"
    source: "E0.2b promoted a ceiling to 'the one architectural finding'; this tests the policy it assumed"
    rig: A
    kill: "D1 disabling does not decouple compliance from recompile; D2 batching does not amortise at high cascade breadth; D3 cascade breadth is insensitive to card-bank duplication"
    predicted: uncertain
    status: PASS
    result: results/e0_2c_deletion_policies.json
    finding: >
      All three pass, which DEMOTES E0.2b's ceiling. E0.2b assumed the most
      expensive policy in the space - eager, per-tombstone, fully-recompiling,
      parallelism as the only relief - and folded three separable things into
      one number.
      D1: disabling an affected adapter is ~28,800x cheaper than recompiling it.
      Deletion CORRECTNESS is bought by disabling; recompilation restores
      COMPETENCE. Only the second is rate-limited, so E0.2b reported a
      service-quality limit as a correctness rate limit.
      D2: batching amortises hard and the union saturates at fleet size. At
      batch 16 throughput is 24 deletions/day at EVERY cascade breadth, versus
      1.57-2.53/day at batch 1. Batching does not merely help - it makes
      throughput independent of cascade breadth, because per-deletion cost is
      |union|/b x recompile and |union| is bounded by the fleet.
      D3: cascade breadth is a monotone function of card-bank duplication -
      63.1% at 1 card per entry rising to 98.8% at 6. So L3 admission control is
      a direct lever on L7 deletion cost.
    new_finding: >
      The first cross-tier design constraint in the programme, and it is a
      coupling rather than a limit: L3's card-bank admission threshold sets L7's
      deletion cost. Worth noting that SESA's stated cap of cosine <= 0.93 is
      too loose to bind it - mean card cosine of 0.779 already yields 98.8%
      cascade breadth, so the threshold as specified does not control deletion
      cost at all.
    corrects: >
      E0.2b's C2 should not have been promoted to "the one genuinely
      architectural finding". The identity capacity/(cascade x recompile) is
      sound arithmetic about a policy, and the policy was the most pessimistic
      one available.
    parameterisation_bug: >
      The first run of this experiment moved cascade breadth the WRONG WAY
      (68.3% -> 45.3% as overlap rose) because the overlap knob shrank the pool
      of entries feeding any card at all, rather than raising how many cards
      each entry feeds. Re-parameterised as an explicit multiplicity with
      participation held fixed. Rig bug B5.

