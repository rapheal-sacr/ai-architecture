  - id: E0.2d
    tier: L3 x L7
    claim: "card-bank admission control (cos <= 0.93) is a lever on cascade breadth"
    source: "E0.2c reported D3_admission_is_a_lever: true; this tests it as an intervention"
    rig: A
    kill: "L1 breadth does not respond to provenance overlap; L2 breadth does not respond to content cosine with provenance held fixed"
    predicted: uncertain
    status: FAIL
    result: results/e0_2d_admission_lever.json
    finding: >
      L2 FAILS and E0.2c's D3 INVERTS. Panel A reproduces E0.2c: multiplicity
      1->6 moves provenance overlap 0.000->0.561, card cosine 0.046->0.779 and
      cascade breadth 62.7%->97.8% together - a common cause, not an
      intervention. Panel B holds provenance fixed at overlap 0.307 and varies
      only the per-card distillation projection: card cosine moves 0.519->0.021,
      a range of 0.498, while cascade breadth moves 97.0%->96.7%, a range of
      0.009.
    consequence: >
      Content cosine is not a lever on cascade breadth. SESA's cos <= 0.93 is a
      redundancy filter on card CONTENT; breadth is set by PROVENANCE overlap -
      how many cards share a source entry. E0.2c's world coupled the two only
      because card content was constructed as the mean of its source entries. In
      a real bank they come apart: two cards can capture different patterns in
      the same entries and be near-orthogonal in content while sharing every
      source.
    why_this_is_not_a_spec_defect: >
      The design has NO stated lever on cascade breadth. The repair is not
      retuning 0.93 - it is provenance-aware admission, capping source-entry
      overlap between admitted cards, which is a NEW MECHANISM. A missing
      control surface cannot be fixed by rewording, so this is the closest thing
      the programme has produced to an architectural finding.
    corrects: "E0.2c's D3, and the claim in that commit that L3 admission sets L7 deletion cost"

  - id: E3.1
    tier: L7
    claim: "ranking by net transfer accumulates abstractions rather than patches"
    source: "Part II section B - the central generalization claim of the architecture"
    rig: A
    kill: "T1 transfer does not beat target on held-out compositional tasks in the clean regime; T2 the margin does not survive probe noise and spurious off-target correlation; T3 transfer does not acquire compositional-only skills; T4 the margin does not survive patches carrying REAL positive spillover"
    predicted: uncertain
    status: PARTIAL
    result: results/e3_1_transfer_ranking.json
    significance: >
      The first claim tested in this programme whose failure would have had no
      local repair. Every earlier experiment asked a local mechanism question -
      is this formula right, is this list complete - and local errors are
      locally fixable by construction, which is why the "every failure is a spec
      defect" record was closer to selection than to evidence.
    clean_regime_caveat: >
      E3.1b also shows the CLEAN regime's compositional scores are themselves
      tiebreak-sensitive: transfer's compositional score spans 0.053
      (prefer_patch) to 0.582 (prefer_skill) against 0.333 under "first". So T1's
      +0.085 margin holds under neutral tiebreaks (first 0.333, random 0.329,
      both above target's 0.264) but is not robust to adversarial tie
      resolution. The tied set exists only because a noiseless world produces
      exact ties; in the noisy regimes spread is 0.000 across all four rules, so
      T2's +0.147 margin is artifact-free. Quote the noisy regimes, not the
      clean one.
    finding: >
      T1, T2, T3 pass; T4 FAILS. Clean regime: transfer 0.349 compositional
      versus target 0.264, margin +0.085 (but see clean_regime_caveat). The
      margin GROWS under
      measurement noise to +0.147, 173% of clean - because target ranking takes
      a max over noisy per-region deltas while net transfer takes a sum, and
      summing is variance-reducing. That was not predicted.
      T4: give patches a systematically positive off-target spillover of 0.02
      and the margin collapses to -0.008. Both arms fall apart (compositional
      0.021 and 0.013 against 0.264 and 0.349 clean) because every candidate
      then looks good on net transfer, the ranking signal saturates, and the
      gate stops discriminating at all - it learns 3.6-4.2 skills against 9-10.
    mechanism_is_not_the_stated_one: >
      Net transfer does not DETECT generality. It removes the reward for
      narrowness: when patches have near-zero real off-target effect they score
      ~0 on the statistic while general candidates score positive, so generality
      wins by default.
      The supporting argument is ANALYTIC, not numerical: a first-order
      statistic over per-region deltas cannot distinguish a candidate whose
      per-region deltas are all zero from one already applied. Compositional-only
      skills are exactly that case, so no such statistic can see them.
    withdrawn_evidence_verbatim: >
      "transfer acquires compositional-only skills at 55% while learning 72% of
      skills overall, so it still UNDER-acquires exactly the skills whose value
      is invisible to a first-order measure."
    withdrawn_because: >
      E3.1b: the figure is a tiebreak artifact. Patches, compositional-only
      skills and already-learned skills all score exactly 0.000 under net
      transfer, and the selection loop uses strict `>`, so the tie is resolved by
      pool emission order. Across tiebreak rules comp_only spans 0.005 to 0.780
      (spread 0.775). The published 0.55 is simply the "first" rule.
    superseded_by: E3.1b
    condition_the_design_does_not_state: >
      SUPERSEDED BY E3.1b - the condition stated here is the wrong one.
      This entry originally read: "narrow patches must have near-zero REAL
      off-target effect ... measuring real patch spillover is a Rig B/C question".
      That is the ABSOLUTE condition and it is implausible. T4 applies spillover
      only where kind == "patch"; skills get none. But net transfer is a SUM over
      off-target regions, so adding the same constant to every candidate shifts
      every score equally and cannot change the ranking. Only an ASYMMETRY can
      invert the margin, and T4's stated justification - "a low-rank update fit
      to one region is not region-confined" - does not distinguish the two
      candidate types. A skill adapter is also low-rank and fit to a BROADER
      distribution, so on that reasoning it should spill more.
      The real condition is DIFFERENTIAL: patches must not spill over more than
      skills by more than ~0.03, which in this world's units is 0.5 x GAIN_SKILL
      or 0.21 x GAIN_PATCH, and should be carried as a ratio. Much weaker, and
      arguably favourable a priori.

  - id: E3.1d
