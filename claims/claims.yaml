      0.5B, 417 tok/s at 1.5B.
      H2 passes decisively - rank 4 to 32 changes wall-clock by +4.5% and +2.2%.
      Rank is a BUDGET quantity, not a TIME quantity, so the subspace budget and
      H are not coupled and E5.1 needs no extra edge.
      H1 passes within the memory envelope: +9.9% per-token drift across 128-512
      at 1.5B. So capping the draw does bound H and E0.1's A6 resolution holds.
      H3, the number E5.1 needed: at E0.1's established draw cap of 300 entries,
      H is 18 MINUTES at 1.5B, not 8 hours. Reaching 8 hours needs a draw of
      ~7,800 entries, more than an order of magnitude past the cap.
    consequence_for_E5_1: >
      At the design's own profile (fleet 64, 4-way parallel, 7-day tolerance):
        assumed  H = 8h     drain 5.33d   window [5.33, 3.33]  EMPTY
        measured H = 0.31h  drain 0.20d   window [0.20, 13.59]  OPEN
      E5.1's infeasibility at that profile was carried ENTIRELY by the assumed H.
      One of the four gating quantities is now resolved, and it was the one
      carrying the verdict.
    scope: >
      An M2 at 1.5B is not production hardware and these seconds are not
      production H. What transfers is the STRUCTURE - H scales in drawn tokens,
      is bounded by the draw cap, and is insensitive to rank - plus a throughput
      anchor a production run can be checked against. Whether production H is 19
      minutes or 8 hours depends on model size and hardware the design never
      states, which is itself the finding: "hours-days" was never a checkable
      claim.
    rig_limit_worth_recording: >
      A memory cliff at seq_len 1024 for the 1.5B model and 2048 for the 0.5B -
      per-token cost jumps 17x. The cliff SCALES WITH MODEL SIZE, so it is paging
      on 8 GB rather than quadratic attention, which would blow up at the same
      length regardless. This bounds what Rig B can measure on this machine and
      is reported rather than buried in a drift statistic.

  - id: E5.2
    tier: cross
    rig: A
    claim: "NONE -- this is a decision table, not an experiment"
    source: "support redundancy is E5.1's second gating quantity and is not measurable on any rig here"
    kill: "deliberately none. Registering a kill criterion would imply this measures the design; it measures the consequences of a parameter nobody has measured."
    status: reference
    result: results/e5_2_support_decision_table.json
    procedure: docs/support_redundancy_procedure.md
    finding: >
      THE LOOKUP: if real harvested probes rest on 5 or more supporting entries,
      C6 stops binding. Only the 3-entry shape (2 of 3) fails, and only at high
      decay (0.250 against a 0.20 tolerance). Every shape with k >= 5 clears at
      every swept decay rate.
      That 2-of-3 shape was the value pinned in every run before E5.1 swept it,
      so the constant carrying the constraint was the pessimistic end of its
      range - the same shape of problem as H, and resolvable the same way.
    second_table_matters_more: >
      Compile adequacy (I11) binds harder than C6 at aggressive draw caps. No
      support shape clears an 0.80 coverage floor at a 25% draw; 2-of-8 needs
      f >= 0.50 and 2-of-3 needs f >= 0.75. So the draw cap and support
      redundancy trade against each other, and at low caps the binding constraint
      is whether the compile covered the region at all rather than whether decay
      broke it. That is I11's whole point and why it needed to be an invariant.
    watch_for: >
      k correlating with region frequency. If rare regions have systematically
      smaller support sets, C6, I11 and the whole weighting-rule enumeration all
      bind hardest in the same place and the anisotropy gains a fifth symptom.

# -- rig bugs found so far, all of which changed a reported result ---------
#
# Kept in the ledger rather than only in git history, because the rate and the
# kind matter: every one of these produced a confident number first.
bugs:
  - id: B1
    where: e1_1_spectrum_knee.widest_plateau
    bug: "counted saturation regions (rank pinned at 1 or dim) as elasticity plateaus"
    effect: "credited a power-law spectrum with a 3.82-decade plateau it does not have"

  - id: B2
    where: world.Region.practice
    bug: "competence advanced once per cycle regardless of tasks allocated"
    effect: "a region starved to one task learned as fast as one given a hundred, hiding the entire cost of misallocated budget"

  - id: B3
    where: ledger.residual_influence
    bug: "measured whether weights CHANGED under substitution of the deleted value"
    effect: >
      reported zero leakage for a policy with 186 missing influence paths.
      Cached weights are constants - stale, not sensitive. Produced a confident
      PASS on the claim this plan most expected to fail, and was caught only
      because U1 and U2 contradicted each other.

  - id: B19
    where: e0_1_verified_recompilability, arm table
    bug: "A6 carries decay=0.25 and A4 carries none, so A6 is not a matched control for A4"
    effect: >
      The stratified-vs-usage tradeoff - pooled 0.246 / worst 0.520 against
      0.165 / 0.624 - is measured ACROSS A DECAY DIFFERENCE. That tradeoff is
      the empirical demonstration of the weighting rule's own cost, so the one
      number quantifying what equal-draw protection costs is confounded. Not a
      wrong number: an uninterpretable comparison. Found by review, not by the
      rig, because no manipulation check asks whether two arms differ ONLY in
      the manipulated quantity.
    status: open
    fix: "re-run A6 against A4 with matched decay (worklist 2.5); until then the cost figure is not citable"

  - id: B18
    where: e0_2f breadth reconciliation, first run
    bug: "used n_rollouts=48 against n_adapters=64, giving one rollout per adapter and sixteen adapters with none"
    effect: >
      the influence graph read ~0.013 flat -- an entry can reach at most one of
      64 adapters by construction - which would have been reported as a THIRD
      disagreeing number in a reconciliation whose entire purpose was to settle a
      disagreement between two. Caught by checking the adapter structure before
      reporting, because a third number was implausible.
    fix: "n_rollouts = n_adapters * ROLLOUTS_PER_ADAPTER, matching E0.2d's 6 each"

  - id: B17
    where: e0_2e_r9_breadth_coverage coverage_of
    bug: "measured I11 coverage as at-least-one-card-per-region, a binary, when I11 is written as a RATE"
    effect: >
      reported coverage 1.000 at every tau and every pool structure, and could
      not have reported otherwise - the bank only drops below one-card-per-region
      once it falls under ~16 cards total, while the quantity actually moving is
      a 25x change in per-region density. Led to the published claim that R9's
      expected tension with I11 "does not bind", which is withdrawn. Re-measured
      as a rate, 100% of regions fall below the density floor at tight tau.
    the_pattern_at_its_most_pointed: >
      The quantity that got binarised was per-region density on rare regions -
      the exact quantity this entire record is about. A binary cannot carry a
      tension that is a rate.
    fix: "report per-region density, worst region and fraction below floor; declare the SHAPE of a quantity, not only its name"

  - id: B16
    where: e0_2e_r9_breadth_coverage, breadth definition
    bug: "measured breadth as mean fraction of the CARD BANK an entry feeds, not fraction of the ADAPTER FLEET"
    effect: >
      gave 0.016-0.062 where E0.2d reports 0.63-0.99, so every configuration
      passed the 0.31 target trivially and G1 would have reported R9 solved. The
      chain is entry -> cards -> rollouts -> adapters; an entry feeding 2% of a
      400-card bank can still reach most adapters. Caught by the scale being two
      orders off a number already in the record.
    also: >
      the first candidate-pool parameterisation used a hard cutoff on a hot
      slice, which at high concentration made every card's source set IDENTICAL -
      the bank froze at one card per region and tau moved nothing. The
      manipulation check caught that one.
    fix: "propagate breadth to the fleet; draw sources Zipfian so overlap is graded rather than all-or-nothing"

  - id: B14
    where: e2_3_staged_ladder, L2 population definition
    bug: >
      ONE omission, not three. Every instance was the same thing: scoring a
      criterion against a population that is empty under an objective that had
      never been named. It surfaced three times - against the mean objective,
      under which no rare specialist is ever "good"; against a gap-closing
      objective that still favoured generalists 0.56 to 0.166; and against
      frequent specialists, which lift zero regions and are never good either.
    effect: >
      L2 returned a spurious PASS or a NaN each time. The manipulation check
      caught all three.
    what_it_actually_is: >
      Not three independent instrument errors. It is R11 surfacing inside the
      instrument. The design's failure to state what promotion optimises did not
      merely leave a finding ill-posed - it made the experiment unable to define
      its own populations. That upgrades R11 from a documentation fix to a
      PRECONDITION FOR MEASURABILITY, and is a stronger argument for the
      amendment than anything in the results.
    fix: "name the objective before scoring a criterion; verify every compared population is non-empty BEFORE running the sweep"

  - id: B13
    where: e5_2_support_decision_table, first version
    bug: >
      conflated two mechanisms in one table - compile adequacy (does the DRAW
      contain enough support) and decay robustness (does DECAY break it) - and
      reported over-forgetting as a rate conditional on having passed. The
      denominator therefore moved with k.
    effect: >
      produced a table where k=10 looked WORSE than k=3, which is backwards for
      anything called redundancy, and was unusable as the lookup it claimed to
      be. Also listed thresholds 0.50 and 0.34 as separate rows at k=3, where
      both mean "2 of 3" - identical numbers, no signal.
    fix: >
      two tables, each monotone in the direction it informs; support expressed as
      "m of k" rather than a fraction, since fractions are ambiguous at small k.
    caught_by: "the table being non-monotone in the direction it claimed to inform"

  - id: B12
    where: eb_1_recompile_wallclock H1
    bug: "reported H1 NO on +1986% per-token drift, all of it from one point: 1.5B at seq 1024 jumping 17-19x"
    effect: >
      would have published "capping the draw does not bound H", contradicting
      E0.1's A6 resolution - and the run's own output was self-contradictory,
      printing H1 NO and then asserting that capping the draw does bound H two
      lines later. Quadratic attention from 512 to 1024 predicts about 2x, not
      19x. Re-running on the 0.5B model put the identical cliff at 2048 instead
      of 1024: the blowup point scales with MODEL SIZE, which is paging on 8 GB,
      not the algorithm.
    caught_by: "asking why a number was so extreme -- the fourth time that question, not a cross-check, found the bug"
    fix: "detect the cliff, exclude beyond-cliff points from the drift statistic, report the memory envelope as its own finding"

  - id: B11
    where: e5_1_joint_feasibility per-constraint attribution
    bug: >
      ranked constraints by elimination fraction when each constraint's drivers
      were swept at wildly different resolution - C1 on a balanced 45-point grid,
      C4 and C6 on single pinned tolerances, PROFILES bundled into six named
      combinations rather than a factorial.
    effect: >
      produced "C1 is the least binding constraint" and a self-criticism that
      "most of this programme's effort went to the non-binding constraint". Both
      withdrawn. The ranking measured grid freedom. This is the programme's own
      pinned-parameter lint applied to the lint's own output, and failing it.
    fix: "report elimination as a curve against each constraint's own tolerance; never rank at a single point"

  - id: B10
    where: e5_1_joint_feasibility union_size and batch_window
    bug: >
      union modelled as LINEAR in batch and clipped at fleet, rather than the
      exponential saturation fleet*(1-(1-beta)^b) that independent per-tombstone
      touching implies; and the closed-form window evaluated at the SATURATED
      union, pinning cascade breadth at its worst value.
    effect: >
      overstated C3's cost most severely in the low-breadth regime where
      feasibility lives, and turned a breadth-conditional result into one
      reported as "independent of every other axis". Third instance of the
      pessimistic-corner pattern after E1.2's disjoint domains and E1.1c/d's
      overlap 0.
    also: "the box was too small on two axes, so the reported ~1% density was a statement about where I looked; corrected to 7.1%"
    fix: "exponential union; solve the window as a fixed point; interiority check on every axis"

  - id: B9
    where: e5_1_joint_feasibility
    bug: "reported an EMPTY feasible region twice, from unswept parameters rather than from the design"
    effect: >
      Run 1: C6 fixed the decay rate at 0.25 and failed in 100% of configs
      including at an uncapped draw, so it measured the decay model rather than
      the draw cap. Run 2: deployment constants were fixed, and the emptiness was
      a two-constraint arithmetic conflict at those constants, independent of
      every swept axis. Publishing either would have been a claim about my
      constants. Caught both times by asking why a constraint never
      discriminated.
    fix: "sweep the parameter; report the closed-form boundary alongside the sweep"

  - id: B8
    where: e0_1_verified_recompilability, arm A4
    bug: "ontology_shift only feeds strata(), which only the stratified draw consults, while A4 ran under the usage draw"
    effect: >
      A4 reported "identical" and K4 passed - on the arm the amendment flagged as
      most likely to surprise. Inert by construction, the same defect class as
      unanimity reporting zero unsafe on a quantity its own free_mask excludes.
      Scored on the stratified arm instead, K4 FAILS at 21.7% pooled competence
      change. Caught before publication by asking whether the manipulation could
      reach the measured quantity.
    fix: "score A4 on a policy that consults the partition; assert the usage arm is inert as a control"

  - id: B7
    where: e1_2_lambda_unanimity.EPS
    bug: "the commitment threshold sat below every direction's equilibrium visit rate"
    effect: >
      nothing was ever free, all four release rules starved 100% of requests, and
      U1 "passed" because both arms failed identically - a criterion that could
      not return the other answer, in a run whose whole purpose was to compare
      arms. Caught by the result being uniform across arms that should differ.
    fix: "EPS must fall inside the range of per-direction rates; range here is 0.46-7.39, EPS set to 1.0"

  - id: B5
    where: influence.InfluenceWorld card construction
    bug: "the card-overlap knob shrank the pool of participating entries instead of raising per-entry card multiplicity"
    effect: >
      cascade breadth moved the wrong way with overlap (68.3% -> 45.3%), which
      would have reported the L3/L7 coupling with an inverted sign. Caught by
      the direction being implausible, not by any check.

  - id: B4
    where: spectrum.stream_domain_mixture
    bug: "re-drew qr(normal(...)) domain subspaces on every call"
    effect: >
      train and held-out sets came from unrelated subspaces, so 99% of train
      energy needed 37 directions while the same fraction of test energy needed
      127 of 128. This manufactured the headline "realistic traffic saturates
      the space, leaving 6 free directions" finding, which was reported and has
      now been withdrawn. The most consequential bug so far, and the only one
      that biased a result AGAINST the design.
    caught_by: >
      A capacity sweep added to check whether the result was an artifact of the
      chosen dimension. It was. Nothing in the original experiment would have
      surfaced it.

# -- repairs proposed by experiments, not yet adopted ----------------------
repairs:
  - id: R1
    from: E1.1, E1.1b
    proposal: >
      Restate the subspace budget in Part II section A using the energy
      criterion the design already points at - keep the top-r directions
      holding a chosen fraction rho of held-out feature energy - instead of
      thresholding eigenvalues at eps. Pick r on a calibration sample and
      measure on a fresh one.
    evidence: >
      DEMONSTRATED, not sketched. E1.1b: all four streams workable, including
      power law and the realistic domain mixture, with the free-rank budget
      only emptying at 5x over-subscription.
    status: demonstrated
    note: >
      This supersedes the original R1, which proposed a measured-perturbation
      allocation rule as a speculative replacement. That is still worth having
      as a belt-and-braces check at allocation time, but it is no longer needed
      to rescue the mechanism.

  - id: R2
    from: E1.4
    proposal: >
      Score gaps by reducible variance - the decline in variance attributable
      to prior practice - rather than by variance level.
    evidence: "passed A1 and A2 at zero competence cost in E1.4"
    open: "stability under noisy pass-rate estimates is untested"
    status: proposed

  - id: R3
    from: E0.2
    proposal: >
      Record adapter provenance as the transitive closure through the
      conditioning skill card, not just the entries a trajectory cited
      outright. One line in the recording policy.
    evidence: "eliminates all 186 unrecorded influence paths and all leakage in E0.2"
    open: >
      The simulated influence path is linear and additive. Whether real
      parametric carryover from card-conditioned rollouts is fully captured by
      set-closure over the card's sources is a Rig B question, and the honest
      answer may be that provenance bounds the leak rather than closing it.
    status: proposed

  - id: R4
    from: E4.2
    proposal: >
      Split the blast-radius boundary in two. SEAL harness code any verifier
      executes through (retrieval policy, dispatch, tool schemas, judge model,
      the promotion gate itself). PIN derived views by stamping each Assay run
      with the versions it ran against, reusing the L2 weight-version
      mechanism. And move gate thresholds - eps, eps_reg, noise_leeway - from
      the L9-editable list to the sealed list, since they are the promotion bar
      in everything but name.
    evidence: "E4.2 static reachability and injection"
    open: "sealing retrieval policy removes it from L9's search space, which is where SIA found scaffold edits actually pay. Cost of the seal is unmeasured."
    status: proposed

  - id: R5
    from: E3.3
    proposal: >
      Replace "maximize off-diagonal mass" with "minimize held-out predictive
      error of the induced T". Same data, same observation-grain tau rows, and
      it has an interior optimum instead of a monotone drive to atomisation.
    evidence: "recovers the planted 4-cluster structure exactly in E3.3"
    open: "tested on nested partitions aligned with the truth; unaligned or non-nested candidate partitions are untested"
    status: proposed

  - id: R11
    from: E2.3
    proposal: >
      State which objective promotion serves - mean per-region value or I11
      coverage - and make the cheap rung rank by THAT statistic. A mean-based
      filter cannot serve a coverage objective at any probe allocation, because
      a specialist's mean is low by construction. If the objective is coverage,
      the cheap rung needs a coverage-aware score (regions lifted above floor,
      or worst-region gain), not a cheaper version of the mean.
    evidence: >
      E2.3: ~100% of good rare specialists dropped at the cheap rung against ~36%
      of generalists, identical in the unbiased control, so probe allocation is
      not the lever.
    open: >
      A coverage-aware cheap rung may be more expensive than a mean, since it
      needs per-region resolution rather than an aggregate. That cost is
      unmeasured and it is the reason the ladder exists.
    upgraded_by: >
      B14. Stating the objective is not a documentation fix - it is a
      PRECONDITION FOR MEASURABILITY. E2.3 could not define its own comparison
      populations without it, and failed to three times before naming it. An
      unstated objective does not merely leave findings ill-posed; it makes
      experiments unable to say what they are measuring.
    status: proposed

  - id: R6
    from: E2.1
    proposal: >
      Filter harvested probes by verification tier before sealing. One
      predicate, and it removes the 29-63% of an unfiltered suite that is
      laundered T3 judge opinion.
    open: >
      Does nothing for representativeness. Gap-set-weighted yield still falls
      to 0.165 at high checkability/easiness correlation, and that is the part
      with no repair.
    status: proposed

  - id: R7
    from: E0.2b
    proposal: >
      Verify unlearning instead of inferring it. After a cascade, recompute the
      affected adapters and compare against the held weights - the same
      operation E0.2b uses as ground truth. Runs once per deletion, not once
      per promotion.
    rationale: >
      Structurally the same move as R1: measure what actually happened instead
      of counting what a bookkeeping rule predicts. Needed because no set-based
      provenance closure can be complete - the residual dependency is on a
      retrieval that was never run.
    status: proposed

  - id: R8
    from: E0.2c
    proposal: >
      Split deletion into two service levels: DISABLE affected adapters
      immediately, which is what makes deletion sound, then BATCH recompilation
      over a window to restore competence. Set L3's admission threshold with
      deletion cost in mind.
      WITHDRAWN IN PART by E0.2d: the original text said "set it tighter than
      cos <= 0.93, which does not bind". That presumed cosine is a lever on
      breadth, and it is not. Replaced by R9.
    evidence: >
      E0.2c: disabling is ~28,800x cheaper than recompiling; batching at window
      16 makes throughput independent of cascade breadth at 24 deletions/day.
    open: >
      Competence during the disabled window is unmeasured, and at 98.8% cascade
      breadth that is nearly the whole adapter fleet off at once.
    status: proposed

  - id: R9
    from: E0.2d
    proposal: >
      Add provenance-aware admission to L3: cap SOURCE-ENTRY overlap between
      admitted cards, alongside the existing content-cosine redundancy filter.
      Content cosine and provenance overlap are different axes and only the
      second sets cascade breadth.
    why_new_mechanism: >
      This is not a threshold change. The design currently has no instrument
      that acts on provenance overlap, so there is no setting of cos <= 0.93
      that controls deletion cost. A missing control surface cannot be
      reworded into existence.
    open: >
      Untested. Capping provenance overlap constrains which cards may coexist,
      and the cost to card-bank coverage is unmeasured - it may trade deletion
      throughput against skill-library completeness.
    status: proposed

  - id: R10
    from: E3.1
    proposal: >
      State Part II section B's unstated condition explicitly, and measure it:
      net-transfer ranking separates abstractions from patches only while narrow
      patches have near-zero REAL off-target effect. Measure adapter spillover on
      real models before relying on the rule.
    evidence: >
      E3.1 T4: with a systematic +0.02 patch spillover the transfer margin
      inverts to -0.008 and both arms collapse, because the ranking signal
      saturates and stops discriminating.
    status: proposed

  # -- rev 2 rules, recorded as proposed and NOT adopted --------------------
  # From `Recorded, Not Inferred` rev 2.2 section 1.2b. These govern the
  # commitment register, which does not exist in this rig yet. They are here so
  # that when Phase 1/3 builds it, the rules are pre-registered rather than
  # written after the numbers land -- and so that a reader can tell design prose
  # from tested mechanism at a glance.

  - id: R-a
    from: "rev 2.2 section 1.2b"
    proposal: >
      Probe sets are write-once. An owner's probe set is drawn at compile time
      from its own provenance and is immutable for the owner's lifetime - never
      re-derived, never resampled. I1 applied to the draw itself.
    why: >
      Half of what makes K4 damaging. K4's 21.7% needs items REASSIGNED between
      strata and the draw REDRAWN. R-a removes the second.
    open: "untested. The register does not exist in Rig A yet; worklist 3.2 is the churn simulation that would test it"
    status: proposed-not-adopted

  - id: R-b
    from: "rev 2.2 section 1.2b"
    proposal: >
      Probe coverage is monotone under churn. No churn operation reduces the set
      of probes the fleet is evaluated against. Merge takes the union with a
      PER-PROBE floor, not a mean over the set. There is no split operator - a
      split is two promotions citing the parent's provenance plus one verified
      retirement. On retirement the retiree's probe set moves to the fleet
      residual set rather than being discarded.
    why: >
      The per-probe floor is E2.3's mean-ranking failure caught one level up: a
      mean over a union dilutes any single regression exactly as a mean over
      regions discarded rare specialists at 2.81x.
    open: >
      Costs are stated but unmeasured. Unions grow and the residual set grows,
      so evaluation cost rises monotonically against a bounded budget - E4.4's
      shape with a different denominator, and the crossover is unmeasured.
    status: proposed-not-adopted

  - id: R-c
    from: "rev 2.2 section 1.2b"
    proposal: >
      The cover is TOTAL. The fleet residual set holds probes for all provenance
      no live owner covers - not only probes orphaned by retirement. Emit
      `unowned provenance fraction` as a standing metric.
    why: >
      A cover is not a partition. Competence in a region where nothing was ever
      promoted has no owner, therefore no probe set, therefore no protection
      statistic - it is ABSENT rather than under-weighted, and nothing reports
      its loss. Without R-c the register trades a statistic that under-protects
      the tail for a record that does not cover it, and the substitution is
      invisible by construction.
    open: "the unowned fraction on real provenance is unmeasured. Worklist 1.3 emits it; 3.1 kill criterion 3 scores it"
    status: proposed-not-adopted

  - id: R-d
    from: "rev 2.2 section 1.2b"
    proposal: >
      Probes are deduplicated at draw time, keyed on provenance. Draw from the
      existing pool first; create only what is missing.
    why: >
      Section 1.3's whole pricing argument - granularity is compute-expensive
      and oracle-cheap - depends on overlapping owners SHARING probes. Without a
      dedup rule at draw time that sharing is aspirational and the oracle
      multiplier returns at roughly fleet size.
    open: "conditional on fleet provenance overlap, which is unmeasured. Worklist 2.3 measures it and decides whether 1.3 survives at all"
    status: proposed-not-adopted

# Challenges raised against a published result and then withdrawn. Recorded
# rather than dropped: a result that spent two rounds under a cloud should show
# that it did, and the reason the cloud lifted is itself a method finding.

retractions:
  - id: X1
    against: "E0.1 arm A1a -- and therefore the K1/KB headline, 6.7% pooled vs 79.8% worst, blindness 12.4x"
    challenge: >
      Review rev 2.0 extended K4's missing null-treatment control to A1a: if the
      stratified arm confounds relabelling with resampling, A1a's drift result
      might likewise be resampling noise measured against a usage-draw baseline.
    withdrawn_because: >
      DERIVABLE FROM THE CODE PATH, not from a run. A1a is cap=None, and draw()
      returns the whole live set before the policy branch is reached, so its
      draw is deterministic and policy-independent. The only thing decay varies
      is which entries are alive. alive unchanged => equal draws => equal passes
      => over-forgetting exactly 0. The matched null needs no arm.
    scope: >
      Exactly four arms reach rng.choice and are affected: A3, A4-stratified,
      A6-uniform, A6-stratified. A0, A1a, A1b, A2 and A4-usage are deterministic.
      Leg 1 of the no-inferred-partition argument stands, E0.1's headline stands,
      and the weighting rule stands twice over - on A1a, and independently on
      E1.1c's Spearman -0.95, which has no draw policy in it at all.
    method_finding: >
      A control registered on a deterministic path is dead weight AND it casts
      doubt where none exists. This is the mirror of B7, where a control was
      registered on a quantity the run never exercised. Both are the same
      failure: not asking what the code CAN do before asking what the world did.
      Now a standing method commitment in PLAN.md section 4.
