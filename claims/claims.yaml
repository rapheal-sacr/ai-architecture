      (iii) the box was too small on two axes. The feasible set sat at the
      minimum swept region count and draw fraction, so "~1% feasible" was a
      statement about where I looked. Extending both, it is 7.1%.
    anomaly_resolved: >
      The earlier report that global use-based decay yielded MORE feasible
      configurations than per-region stratified decay was an artifact of the
      linear union form and the undersized box. Corrected: stratified 3510
      against use_based 3348, which is the direction the weighting rule predicts.
    what_this_does_not_establish: >
      C1 and C6 are measured; C2, C3, C4 and cascade breadth are computed from
