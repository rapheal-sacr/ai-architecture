      a bundled axis of six named combinations rather than a factorial. A
      constraint whose drivers are finely swept will always look less binding,
      because the grid hands it room to be satisfied. This is the programme's own
      "a constraint that always or never binds is more likely a pinned parameter
      than a property" lint, applied to the lint's own output and failing it.
    elimination_curves: >
