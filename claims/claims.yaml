# Machine-readable claim ledger for the WAM falsification plan.
#
# status: untested | running | PASS | FAIL | PARTIAL
# predicted: what this plan expects before running (pre-registration)
#
# Keeping this separate from PLAN.md so experiment runners can assert against
# it and so the pre-registered prediction cannot be quietly edited after a run
# without showing up in the diff.

meta:
  design_docs:
    - "Architecture Design/wam_L8_L9_ledger_anchored_self_improvement.md"     # Part I
    - "Architecture Design/wam_L8_L9_part2_mechanisms.md"                     # Part II
    - "Architecture Design/wam_L8_L9_part3_response_to_review.md"             # Part III
    - "Architecture Design/transformer_vs_write_ahead_memory.png"             # L0-L6
    - "Architecture Design/wam_L7_ledger_anchored_plasticity.png"             # L7
  rigs:
    A: "ledger simulator, no model, runs on the M2 in seconds to minutes"
    B: "small real model, MLX, <=3B 4-bit, 8 GB ceiling"
    C: "rented GPU, episodic, survivors only"

claims:

  # -- Root 0 - invariants -------------------------------------------------
  - id: E0.1
    tier: L7
    claim: "I4 - competence regenerates from provenance alone"
    source: "L7 card; Part II section G calls this untested"
    rig: A
    kill: "K0 A0 recompiler non-deterministic; K1 over-forgetting on surviving support; K2 under-forgetting on fully-tombstoned support; K4 ontology re-partition changes competence; KB worst-region rate >= 2x pooled"
    predicted: uncertain
    status: FAIL
    result: results/e0_1_verified_recompilability.json
    tested_against: docs/wam_amendment_I2_I4_rev2.md
    finding: >
      K0 passes - the recompiler is deterministic, so every other arm is
      interpretable. K2 passes with a scope limit. K1, K4 and KB fail.
      K1 AND KB, THE HEADLINE. Under uncapped ledger drift, over-forgetting on
      surviving-support items is 6.7% POOLED and 79.8% in the WORST region - a
      blindness factor of 12.4x, the largest in the programme. A pooled-only E0.1
      reports "6.7% over-forgetting, acceptable" while one region is essentially
      wiped. This is the predicted failure exactly: use-based decay evicts what is
      rarely referenced, so the provenance that decays is the sparse rare-region
      kind, and the arm most likely to show over-forgetting is the one a pooled
      metric is blindest to.
      K4 FAILS, and it was flagged as the arm most likely to surprise. A pure
      signature re-partition - ledger, weights and harness all held fixed -
      changes competence by 21.7% pooled and 41.6% worst-region. The ontology IS
      load-bearing for adapter competence, so Root 3 reaches into Root 1's
      problem exactly as the amendment warned it might.
    i4_is_a_relative_invariant: >
      A1b is inert and that is a finding, not a null. Under a usage-weighted
      capped draw, use-based decay of the tail changes nothing, because those
      entries were never in the draw - the competence they support was already
      absent at COMPILE time. I4 compares A against A' and both are equally
      impoverished. So I4 checks RECOMPILE FIDELITY, not COMPILE ADEQUACY, and
      cannot see competence that was never compiled in the first place. Nothing
      in Parts I-III distinguishes the two.
    coverage_gap: >
      41.1% of suite items fall in the partially-tombstoned category, about which
      the amended I4 asserts nothing. That is the honest size of what the
      item-level test cannot see, and it is large.
    harness_granularity_vindicated: >
      A3 - changing ONE harness component (the draw policy) - produces 21.6%
      pooled over-forgetting. Without the component-granular I2 stamp, E0.1's
      result would confound the property under test with harness drift, which is
      why the amendment's B section is a prerequisite rather than a nicety.
    a6_resolution: >
      Capping the draw DOES bound cost - 450 uncapped against 300 capped - so the
      resolution holds: retain |P| in full, bound the L3 draw, and cost is
      bounded without distilling provenance. The cost/breadth tension dissolves
      rather than resolving. But it relocates into the weighting rule: WHICH
      entries the cap admits is a protection decision, and a usage-weighted draw
      is exactly the forbidden weighting. Stratified drawing trades a higher
      pooled rate (0.246 vs 0.165) for a lower worst-region rate (0.520 vs 0.624)
      and lower blindness (2.13 vs 3.85) - the weighting rule's tradeoff - and
      still does not reach 1.0x.
    scope_limit: >
      This world has no retrieval-mediated card selection, so E0.2b's ~8.7%
      irreducible under-forgetting cannot appear. K2 passing is a statement about
      THIS influence model, not a contradiction of E0.2b, whose whole point was a
      path set-based provenance cannot see.

  - id: E0.2
    tier: L7
    claim: "tombstone cascade reaches every adapter influenced by an entry"
    source: "L7 card - 'unlearning by construction rather than by approximation'"
    rig: A
    kill: "any adapter whose post-cascade weights differ from a clean recompile with the entry gone"
    predicted: FAIL
    predicted_reason: >
      Provenance is recorded entry->adapter, but Part I section 7 says the skill
      card generates the adapter's training set. The real path is
      entry -> card -> card-conditioned rollouts -> adapter. Unless provenance
      takes the transitive closure through those rollouts, parametric carryover
      survives the cascade and unlearning is approximate after all.
    status: PARTIAL
    result: results/e0_2_transitive_unlearning.json
    finding: >
      Under `direct` provenance - the literal reading of "the ledger entry IDs
      it was compiled from", where compilation sees rollouts rather than cards -
      recorded provenance omits influence paths that exist, and the cascade
      fires on 0.13 adapters per tombstone rather than 3.23. That a gap exists
      is established by argument, not by this run.
    retracted: >
      The reported transitive-arm result - "0 leaks, complete provenance, fixes
      it completely" - is WITHDRAWN as tautological. record_provenance(policy=
      "transitive") and true_influencers execute the same loop body, so U2 is
      X - X = the empty set for every world, seed and parameterisation. The arm
      could not have returned any other answer. What was demonstrated is that a
      two-hop influence model is closed under two-hop closure.
    also_invalid: >
      The 95.9% figure for `direct` is the difference between two code paths and
      its magnitude is set by how often this world's rollouts happen to cite
      card sources directly. It is a knob, not a measurement of the design.
    deeper_problems:
      - >
        true_influencers enumerates exactly two hop types, so any third path is
        invisible to the GROUND TRUTH as well as to both arms. Real third paths
        in the design: entry -> gap statistics -> challenger task distribution
        -> which rollouts exist; and entry -> retrieval ranking -> which card
        surfaced -> rollouts.
      - >
        Set membership is the wrong shape for parametric carryover. If a
        tombstoned entry shaped a card, the card would have been different, so
        EVERY rollout conditioned on it would have been different - not only the
        rollouts citing that entry.
    rebuild_required: >
      Ground truth must be computed functionally - perturb an entry, propagate
      through the world, observe which adapter weights move - so it is
      structurally independent of any provenance bookkeeping. Add at least one
      influence path neither policy captures.
    real_finding_owed: >
      The number nobody has priced: transitive cascade invalidates ~54% of
      adapters per tombstone, and adapters are hours-to-days per the design's own
      substrate table. That implies a tombstone-rate ceiling above which
      unlearning-by-construction is unaffordable. That ceiling decides whether
      L7's strongest claim is operationally real, and E0.2 should have produced
      it.
    measurement_note: >
      The first version tested whether weights *changed* under substitution of
      the deleted value and reported zero leakage despite 186 missing paths.
      Cached weights are constants; they are stale, not sensitive. Only
      comparison against a clean recompile detects the leak.

  - id: E0.2b
    tier: L7
    claim: "REBUILD of E0.2 with functionally-computed ground truth and a third influence path"
    source: "L7 card; rebuild mandated after E0.2's transitive arm was withdrawn as tautological"
    rig: A
    kill: "C1 transitive recall < 1.0 against functional ground truth; C2 sustainable tombstone rate < 1/day at any plausible recompile cost"
    predicted: uncertain
    status: FAIL
    result: results/e0_2b_influence_and_ceiling.json
    method: >
      Ground truth is never enumerated. An entry influences an adapter iff
      DELETING it moves that adapter's weights - the world run twice. That is
      the exact operation a tombstone performs and is independent of every
      provenance policy, including unenumerated ones. The world also adds a path
      no set-based closure can capture: rollouts retrieve their conditioning
      card by query similarity, so deleting an entry can hand a rollout to a
      DIFFERENT card. Provenance records the card that was selected; the card
      that would have been selected was never run.
    finding: >
      C1 fails. Transitive recall is 0.913, not 1.0 - it misses ~9% of adapters
      that deletion genuinely moves, and only 61% of tombstones get complete
      coverage (198 misses observed). The gap is exactly the retrieval path:
      87% of tombstones reassign at least one rollout to a different card, 3.41
      on average. Direct provenance recalls 0.126. Neither policy over-fires
      (0.00), so both are conservative in the wrong direction - they
      under-invalidate silently.
      C2 fails. True cascade is 69% of the fleet per tombstone; at 24h per
      adapter recompile with 4 in parallel that is 0.72 sustainable tombstones
      per day. The ceiling surface shows it falls below 1/day across much of
      the plausible space (25% cascade at 8h is 0.75/day).
    corrects: >
      R3 (transitive provenance) is INCOMPLETE, not a fix. This corrects the
      earlier claim that closure through the conditioning card "closes it
      completely" - which was the tautological result. No set-based closure can
      close it, because the missing dependency is on a counterfactual retrieval
      that was never executed.
    caveat: >
      The 69% cascade fraction is a property of this world's card overlap and
      rollout-to-adapter assignment, not of the design. The ceiling is therefore
      reported as a surface over cascade breadth and recompile cost rather than
      as a single number. What is structural is the shape: cost per tombstone
      scales linearly with both factors, and the design's own substrate table
      already fixes one of them at "hours-days".

  - id: E0.2c
    tier: L7 x L3
    claim: "the E0.2b deletion ceiling holds under policies that are not the worst available"
    source: "E0.2b promoted a ceiling to 'the one architectural finding'; this tests the policy it assumed"
    rig: A
    kill: "D1 disabling does not decouple compliance from recompile; D2 batching does not amortise at high cascade breadth; D3 cascade breadth is insensitive to card-bank duplication"
    predicted: uncertain
    status: PASS
    result: results/e0_2c_deletion_policies.json
    finding: >
      All three pass, which DEMOTES E0.2b's ceiling. E0.2b assumed the most
      expensive policy in the space - eager, per-tombstone, fully-recompiling,
      parallelism as the only relief - and folded three separable things into
      one number.
      D1: disabling an affected adapter is ~28,800x cheaper than recompiling it.
      Deletion CORRECTNESS is bought by disabling; recompilation restores
      COMPETENCE. Only the second is rate-limited, so E0.2b reported a
      service-quality limit as a correctness rate limit.
      D2: batching amortises hard and the union saturates at fleet size. At
      batch 16 throughput is 24 deletions/day at EVERY cascade breadth, versus
      1.57-2.53/day at batch 1. Batching does not merely help - it makes
      throughput independent of cascade breadth, because per-deletion cost is
      |union|/b x recompile and |union| is bounded by the fleet.
      D3: cascade breadth is a monotone function of card-bank duplication -
      63.1% at 1 card per entry rising to 98.8% at 6. So L3 admission control is
      a direct lever on L7 deletion cost.
    new_finding: >
      The first cross-tier design constraint in the programme, and it is a
      coupling rather than a limit: L3's card-bank admission threshold sets L7's
      deletion cost. Worth noting that SESA's stated cap of cosine <= 0.93 is
      too loose to bind it - mean card cosine of 0.779 already yields 98.8%
      cascade breadth, so the threshold as specified does not control deletion
      cost at all.
    corrects: >
      E0.2b's C2 should not have been promoted to "the one genuinely
      architectural finding". The identity capacity/(cascade x recompile) is
      sound arithmetic about a policy, and the policy was the most pessimistic
      one available.
    parameterisation_bug: >
      The first run of this experiment moved cascade breadth the WRONG WAY
      (68.3% -> 45.3% as overlap rose) because the overlap knob shrank the pool
      of entries feeding any card at all, rather than raising how many cards
      each entry feeds. Re-parameterised as an explicit multiplicity with
      participation held fixed. Rig bug B5.

  - id: E0.2e
    tier: L3 x L7
    rig: A
    claim: "R9 (provenance-aware admission) has an acceptable point: breadth <= 0.31 at I11-acceptable coverage"
    source: "the last architectural gap -- E0.2d found no lever on breadth, E5.1 made breadth decide whether an envelope exists"
    kill: "G1 [re-registered] the curve cannot be drawn if breadth's net direction against tau depends on an unspecified coupling; G2 the direct mechanism does not respond to tau"
    predicted: uncertain
    status: FAIL
    result: results/e0_2e_r9_breadth_coverage.json
    finding: >
      R9 CANNOT BE EVALUATED AS SPECIFIED. Tightening the provenance-overlap cap
      does two things at once, and they push opposite ways at every swept pool
      structure:
        cards per entry FALLS  9.18 -> 1.00   the direct R9 mechanism, and G2
                                              confirms it works
        fleet reach     RISES  0.110 -> 0.375  because a tighter cap SHRINKS the
                                              bank, and each adapter still draws
                                              the same number of rollouts, so a
                                              surviving card is used by more
                                              adapters
      Directions are OPPOSED at concentration 0.2, 0.5 and 0.9 alike. Which
      dominates depends on how the adapter fleet composes from the card bank as
      the bank shrinks, and Parts I-III specify none of it.
    what_must_be_specified_first: >
      1. how many distinct cards an adapter's training draw uses
      2. whether that is an absolute count or a fraction of the bank
      3. whether fleet size tracks bank size at all
      Until those are stated, any number for R9 is a choice of coupling wearing
      the clothes of a measurement.
    coverage_side_also_unevaluable: >
      An earlier version of this entry reported that R9's expected tension with
      I11 "does not bind - coverage stays at 1.000 across every tau". WITHDRAWN.
      That was an artifact of the metric: coverage was measured as at-least-one-
      card-per-region, a binary, while I11 is written as a RATE. Re-measured as
      per-region density, the tension is severe: tightening tau takes density
      from 25.0 to 1.0 and puts 100% of regions below the floor, with the worst
      region falling fastest.
      The tension was INVISIBLE, not absent - and the quantity binarised was
      per-region density on rare regions, which is what this entire record has
      been about. So R9 is DOUBLY unevaluable: the breadth side needs three
      specification decisions, the coverage side needs I11 stated as a rate.
    the_floor_is_a_fifth_gating_quantity: >
      DENSITY_FLOOR = 3.0 is CHOSEN, so "100% of regions below floor" is a
      statement about 3.0 in exactly the way "empty window" was a statement about
      H = 8h and "C6 binds" was a statement about 2-of-3. Swept: fraction of
      regions below floor at concentration 0.5 goes
        floor 1.0 -> 0.000 at every tau      no tension at all
        floor 2.0 -> 1.000 / 0.583 / 0.010 / 0.000
        floor 3.0 -> 1.000 / 0.927 / 0.042 / 0.000
        floor 5.0 -> 1.000 / 1.000 / 0.271 / 0.021   total even at loosest tau
      But it is NOT the same kind of quantity as breadth or support redundancy.
      Those must be MEASURED. This one is DECIDED - it needs a sentence, not
      data, and so does the restoration latency tolerance L. Two requirements
      written down plus one coupling specified is the whole distance between R9
      and a drawable curve.
    kill_criterion_changed: >
      G1 was registered as "no admission threshold achieves breadth <= 0.31 at
      acceptable coverage", which presumes the curve is drawable and would have
      reported a net number produced by an uncalibrated modelling choice.
      Re-registered as whether the curve can be drawn at all.
    consistency_with_the_record: >
      This is the same defect every other mechanism here was found to have -
      proposed without stating the tension it trades against. R9 was the proposed
      repair for the last architectural gap, and it arrives with the defect the
      repairs were meant to fix.
    scale_note: >
      Fleet reach here spans 0.077-0.375 against E0.2d's 0.63-0.99, because the
      two worlds differ in bank size and rollout structure. The DIRECTIONS are
      what this experiment establishes; the levels are not comparable across the
      two and are not quoted as if they were.

  - id: E0.2f
    tier: L3 x L7
    rig: A
    claim: "E0.2d's and E0.2e's cascade-breadth numbers measure the same quantity"
    source: "0.627-0.978 against 0.077-0.375, same name, same 0.31 target, 8x apart -- and E5.1's whole breadth-conditional verdict hinges on which is right"
    kill: "R1 instruments disagree >1.5x at the uncapped bank; R2 the influence graph does not show the synthetic draw's tau-dependence; R3 whether either reproduces E0.2d over a realistic bank"
    predicted: uncertain
    status: FAIL
    result: results/e0_2f_breadth_reconciliation.json
    method: "run BOTH instruments over THE SAME admitted bank, so a disagreement is the instrument rather than the world"
    finding: >
      R1 passes, R2 fails, R3 fails, and together they dissolve two things.
      R1: at the uncapped bank the two instruments AGREE -- 0.088 synthetic
      against 0.087 functional, a ratio of 0.99. They are measuring the same
      quantity.
      R2: they diverge only as the bank SHRINKS. The synthetic draw spans 0.287
      across tau; the influence graph spans 0.007 and is essentially FLAT. So
      E0.2e's opposition - tightening the cap raising fleet reach, the thing that
      made R9 unevaluable and appeared to point it backwards - is an artifact of
      the synthetic draw sampling a fixed NUMBER of cards from a shrinking bank.
      Tightening the cap does not raise breadth.
      R3: neither instrument reproduces E0.2d's 0.627-0.978 over a realistic
      bank. Both read ~0.087 against E5.1's 0.31 target.
    what_this_dissolves: >
      E0.2d's 0.63-0.98 came from a world with 8 adapters, 8 cards and 60
      entries, where each adapter's 6-rollout draw covers most of an 8-card bank
      by construction. Breadth is a function of BANK SIZE RELATIVE TO FLEET SIZE
      AND ROLLOUTS PER ADAPTER, and E0.2d measured it at one very small point.
      E5.1 then fitted cascade_breadth(prov_overlap) = 0.60 + 0.45*po to that
      point and made the resulting number decide whether an operating envelope
      exists. Over a bank of 400 cards and 64 adapters the same functional
      instrument gives 0.087 - comfortably inside the window.
      So E5.1's breadth-conditional verdict, and R9's entire premise, rest on a
      quantity that is a property of E0.2d's world size.
    consequence: >
      There may be no breadth problem to repair. Neither world is calibrated to
      reality, so what decides it is the real bank-to-fleet-to-rollout ratio -
      which is a MEASURE quantity for Rig B or deployment, not something either
      simulation settles. R9 should not be designed until that ratio is known,
      and it may then have no job.

  - id: E0.5
    tier: L2/L3
    claim: "margin certificates close E0.2b's residual without running the counterfactual"
    source: "rev 2.2 section 2 - the selection journal"
    rig: A
    kill: "KS any certified selection that flips (fatal); KU certified < 0.70 where the world is stable above 0.70, scored PER POINT; KC uncertified selections not a subset of transitive-closure edges"
    predicted: uncertain
    status: PARTIAL
    result: results/e0_5_selection_journal.json
    finding: >
      SOUND, NARROW, AND NOT A SUBSET - three separate answers that must not be
      collapsed into one word.
      KS PASSES at every point in the sweep: no certified selection ever flipped,
      across 2 arms x 5 ledger sizes x 3 batch sizes x 8 worlds x 6 draws. That
      is the load-bearing half, and it is a property of the algebra rather than
      of the traffic, so it carries out of the rig.
      KU FAILS at 22 of 30 points. Certification is 0.81 at single tombstones
      with well-supported cards and collapses to ~0.00 at EVERY batch size >= 4,
      while the world stays stable at 0.60-0.95. The gap is bound slack, not
      fragility.
      KC FAILS, and in the safe direction. 24,598 uncertified selections lie
      OUTSIDE what transitive provenance would flag, and 2,178 of them - 8.9% -
      actually flipped. Those are selections that moved because a RIVAL card
      rose while the chosen card was untouched. Provenance records the card that
      was selected and cannot record that a competitor gained, so this is
      E0.2b's missing recall seen from the other side. The journal does not
      shrink the cascade as section 2 claims; it enlarges it, and part of the
      enlargement is real influence nothing else can see.
    two_drivers: >
      The pre-registration named support-per-card k, because k is the bound's
      denominator. The control arm shows a second driver of comparable size. At
      b=1, holding touched-fraction pinned at 0.12, k from 3 to 60 buys +0.457;
      holding k pinned at ~8, touched-fraction from 0.33 to 0.02 buys +0.419.
      Both govern it. Only one was predicted, and the cross-arm comparison
      (+0.102) is the wrong number to quote because it nets two opposing effects
      - the same defect as B19.
    unstated_tension: >
      E0.2c's deletion economics rest on BATCHING: window 16 is what makes
      throughput independent of cascade breadth at 24 deletions/day. Batch 16 is
      also where certification is 0.000 everywhere tested. The mechanism that
      makes deletion affordable is the mechanism that destroys the certificate,
      and section 2 and R8 cannot both be adopted at their stated settings.
      Neither document mentions the other.
    scope: >
      The 0.70 kill criterion is written against REAL TRAFFIC and this is a
      simulator, so the certified FRACTION does not transfer - worklist 2.2 is
      the real measurement. What transfers is KS, the two-driver decomposition,
      and the batching tension, none of which depend on this world's numbers.

  - id: E0.6
    tier: L7
    claim: "R-c - the fleet residual set must be total, not only orphans of retirement"
    source: "rev 2.2 section 1.2b"
    rig: A
    kill: "KR1 unowned fraction ~0 everywhere (R-c defends a gap that does not exist); KR2 never-owned is a minority of unowned (R-c is a refinement of R-b); KR3 unowned entries have no true influence (the gap is paperwork, not competence)"
    predicted: uncertain
    status: PASS
    result: results/e0_6_total_cover.json
    finding: >
      R-c IS LOAD-BEARING, AND REV 2 UNDERSTATES IT.
      KR2 FAILS in rev 2's favour: never-owned provenance exceeds
      retirement-orphaned provenance by 3.3x to 5.5x at every traffic level.
      R-c is not a refinement of R-b - it is doing most of the work, and R-b
      alone would ship a cover with a hole in it.
      KR3 PASSES: unowned entries do move adapter weights. 12-41% of them move
      at least one. But THINLY - 0.12 adapters each against 7.71 for covered
      entries at high traffic, so the honest claim is not "a third of competence
      is undefended". It is that a real, small, and structurally invisible
      surface exists.
    traffic_dependence: >
      THE FINDING UNDER THE FINDING. Unowned provenance runs 0.483 at 16
      rollouts to 0.027 at 512. The cover's REACH is set by traffic, even though
      every statistic computed inside it is an equal draw. I8 holds within an
      owner and says nothing about how far the owners collectively reach, so a
      register that wins on tail safety wins over whatever surface traffic
      happened to buy. The gap is largest exactly where traffic is thin, which
      is the tail the register exists to protect.
    grain: >
      And the pooled unowned fraction has the defect this record has now found
      four times. At card grain the worst cell runs to 1.000 while the pooled
      rate is 0.483 - blindness 2.1, peaking at 4.2 - and 37.5% of cards have
      EVERY source unowned at low traffic. `unowned fraction` must be reported
      worst-cell alongside pooled or it will hide a concentrated hole.
    instrument_limit: >
      The per-card grain has its own blind spot, stated rather than discovered:
      an entry in NO card's source list has no cell to sit in, so `worst card`
      reads 0.000 at high traffic while 6.7% of entries are in no card at all.
      Those are the hardest case - no card cites them, so no owner's probe draw
      reaches them by any route. Reported as its own column.

