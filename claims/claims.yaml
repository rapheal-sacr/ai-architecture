# Machine-readable claim ledger for the WAM falsification plan.
#
# status: untested | running | PASS | FAIL | PARTIAL
# predicted: what this plan expects before running (pre-registration)
#
# Keeping this separate from PLAN.md so experiment runners can assert against
# it and so the pre-registered prediction cannot be quietly edited after a run
# without showing up in the diff.

meta:
  design_docs:
    - "Architecture Design/wam_L8_L9_ledger_anchored_self_improvement.md"     # Part I
    - "Architecture Design/wam_L8_L9_part2_mechanisms.md"                     # Part II
    - "Architecture Design/wam_L8_L9_part3_response_to_review.md"             # Part III
    - "Architecture Design/transformer_vs_write_ahead_memory.png"             # L0-L6
    - "Architecture Design/wam_L7_ledger_anchored_plasticity.png"             # L7
  rigs:
    A: "ledger simulator, no model, runs on the M2 in seconds to minutes"
    B: "small real model, MLX, <=3B 4-bit, 8 GB ceiling"
    C: "rented GPU, episodic, survivors only"

claims:

  # -- Root 0 - invariants -------------------------------------------------
  - id: E0.1
    tier: L7
    claim: "I4 - competence regenerates from provenance alone"
    source: "L7 card; Part II section G calls this untested"
    rig: A
    kill: "any non-tombstoned competence not returning within delta; or recompile cost O(ledger) with unbounded ledger"
    predicted: uncertain
    status: untested

  - id: E0.2
    tier: L7
    claim: "tombstone cascade reaches every adapter influenced by an entry"
    source: "L7 card - 'unlearning by construction rather than by approximation'"
    rig: A
    kill: "any adapter whose post-cascade weights differ from a clean recompile with the entry gone"
    predicted: FAIL
    predicted_reason: >
      Provenance is recorded entry->adapter, but Part I section 7 says the skill
      card generates the adapter's training set. The real path is
      entry -> card -> card-conditioned rollouts -> adapter. Unless provenance
      takes the transitive closure through those rollouts, parametric carryover
      survives the cascade and unlearning is approximate after all.
    status: PARTIAL
    result: results/e0_2_transitive_unlearning.json
    finding: >
      Under `direct` provenance - the literal reading of "the ledger entry IDs
      it was compiled from", where compilation sees rollouts rather than cards -
      recorded provenance omits influence paths that exist, and the cascade
      fires on 0.13 adapters per tombstone rather than 3.23. That a gap exists
      is established by argument, not by this run.
    retracted: >
      The reported transitive-arm result - "0 leaks, complete provenance, fixes
      it completely" - is WITHDRAWN as tautological. record_provenance(policy=
      "transitive") and true_influencers execute the same loop body, so U2 is
      X - X = the empty set for every world, seed and parameterisation. The arm
      could not have returned any other answer. What was demonstrated is that a
      two-hop influence model is closed under two-hop closure.
    also_invalid: >
      The 95.9% figure for `direct` is the difference between two code paths and
      its magnitude is set by how often this world's rollouts happen to cite
      card sources directly. It is a knob, not a measurement of the design.
    deeper_problems:
      - >
        true_influencers enumerates exactly two hop types, so any third path is
        invisible to the GROUND TRUTH as well as to both arms. Real third paths
        in the design: entry -> gap statistics -> challenger task distribution
        -> which rollouts exist; and entry -> retrieval ranking -> which card
        surfaced -> rollouts.
      - >
        Set membership is the wrong shape for parametric carryover. If a
        tombstoned entry shaped a card, the card would have been different, so
        EVERY rollout conditioned on it would have been different - not only the
        rollouts citing that entry.
    rebuild_required: >
      Ground truth must be computed functionally - perturb an entry, propagate
      through the world, observe which adapter weights move - so it is
      structurally independent of any provenance bookkeeping. Add at least one
      influence path neither policy captures.
    real_finding_owed: >
      The number nobody has priced: transitive cascade invalidates ~54% of
      adapters per tombstone, and adapters are hours-to-days per the design's own
      substrate table. That implies a tombstone-rate ceiling above which
      unlearning-by-construction is unaffordable. That ceiling decides whether
      L7's strongest claim is operationally real, and E0.2 should have produced
      it.
    measurement_note: >
      The first version tested whether weights *changed* under substitution of
      the deleted value and reported zero leakage despite 186 missing paths.
      Cached weights are constants; they are stale, not sensitive. Only
      comparison against a clean recompile detects the leak.

  - id: E0.3
    tier: L8
    claim: "I3 no-compounding holds for synthetic experience without new machinery"
    source: "Part I section 2; Part III section 6.1"
    rig: A
    kill: "any promotion whose provenance closure contains only synthetic + inferred"
    predicted: uncertain
    predicted_reason: >
      Part III section 6.1 requires every L8 task to chain to an `observed`
      entry. Unclear whether that is enforceable when a task derives from a gap,
      which is a statistic over many entries rather than a pointer to one.
    status: untested

  - id: E0.4
    tier: cross
    claim: "I1 - every promoted capability resolves to observed entries"
    source: "Part I section 10, claim-level auditability"
    rig: A
    kill: "resolution fraction < 1.0"
    predicted: uncertain
    status: untested

  # -- Root 1 - estimator quality ------------------------------------------
  - id: E1.1
    tier: L7
    claim: "occupied rank = #{sigma_k > eps} is a computed constraint, not a guessed integer"
    source: "Part II section A"
    rig: A
    kill: "no decade-wide elasticity plateau (K1); or held-out leakage > 5% / free-write interference > 5% (K2)"
    predicted: FAIL
    status: PARTIAL
    result: results/e1_1_spectrum_knee.json
    scope: >
      This tests only the LITERAL formulation, #{sigma_k > eps}, with eps placed
      at the curvature knee. It is not a verdict on the subspace budget as a
      mechanism - see E1.1b, which tests the stronger reading and reverses the
      conclusion.
    finding: >
      Fails on 2 of 4 streams. Power law: no interior plateau, 29x rank swing
      across two decades of eps, 75% leakage. Bimodal - the design's own assumed
      shape - also fails, and instructively: leakage is quantised in units of
      one committed direction (4.2% of energy each) because eps is a hard cut,
      and the automatic knee-finder missed by two. Placing eps correctly
      requires already knowing the rank eps is being used to compute.
    retracted: >
      The originally reported third failure - "realistic domain mixture leaves
      6 free directions of 128, so allocation deadlocks into permanent
      reclamation" - is WITHDRAWN. It was an artifact of stream_domain_mixture
      re-drawing its domain subspaces on every call, so train and held-out sets
      came from unrelated subspaces. With the generator fixed the domain mixture
      PASSES with 68 free directions and zero leakage. See bugs.B4.

  - id: E1.1b
    tier: L7
    claim: "the subspace budget works under the energy/GPM criterion (top-r by cumulative energy)"
    source: "Part II section A's own pointer to GPM: 'truncated SVD over a small activation buffer - what GPM actually does'"
    rig: A
    kill: "G1 no retention level yields free rank >= 8 at interference <= 5% on held-out traffic; G2 test leakage > 2x calibration leakage"
    predicted: uncertain
    status: PASS
    result: results/e1_1b_energy_criterion.json
    finding: >
      All four streams pass, including power law (workable at rho=0.95, 28 free
      directions, interference 0.048) and the realistic domain mixture (workable
      at 0.95/0.99/0.999, 67/41/22 free directions). G2 passes everywhere -
      leakage blowup from calibration to test is ~1.0x, so the spectrum estimate
      generalises off its own sample. Capacity sweep across dim in {128,256,512}
      and 4-64 domains: the budget only goes empty at a fill ratio of 5.0, i.e.
      5x over-subscription. At every realistic ratio there is ample free rank.
    consequence: >
      E1.1's failure does NOT survive the strongest faithful reading. The
      subspace budget is sound; Part II section A states it in a form
      (thresholding eigenvalues) that is ill-posed, while pointing at a form
      (cumulative energy) that is not. This demotes E1.1 from an architectural
      failure to a specification defect, and makes R1 a demonstrated fix rather
      than a sketch.

  - id: E1.2
    tier: L7
    claim: "three lambda timescales with release requiring unanimity makes rank release safe"
    source: "Part III section 2"
    rig: A
    kill: "time-to-deadlock finite - budget fills monotonically and regions never release"
    predicted: FAIL
    predicted_reason: >
      The long-lambda estimator releases almost nothing, so unanimity means
      near-zero release. Compounds with E1.1's finding that realistic traffic
      starts with almost no free rank.
    status: untested

  - id: E1.3
    tier: L4
    claim: "posterior variance predicts realized error (calibration audit)"
    source: "Part III section 1 - the design's own recommended audit"
    rig: B
    kill: "Spearman rho < 0.5 between predicted variance and realized error"
    predicted: uncertain
    note: "E1.4 already shows rho = -0.99 for the epistemic reading in simulation"
    status: untested

  - id: E1.4
    tier: L8
    claim: "L4's RLS error covariance is already an epistemic gap detector"
    source: "Part I section 3; Part II section A reading 2"
    rig: A
    kill: "noise regions capture > 3x fair share of practice budget (A1); or gate signal rho < 0.5 vs realized error (A2)"
    predicted: FAIL
    status: FAIL
    result: results/e1_4_aleatoric_magnet.json
    finding: >
      Posterior variance is epistemic + aleatoric and the two readings need
      opposite quantities. Predictive reading: one coin-flip region in twelve
      takes 51% of the practice budget (6.2x fair share), rising with horizon -
      an absorbing state, because 4p(1-p) peaks at p=0.5 where a coin flip
      lives permanently. Part III section 6.3's per-source cap only reduces
      this to 4.1x. Epistemic reading fixes the magnet but inverts the gate to
      rho = -0.99. Fix that passes both - score gaps by reducible variance
      (a derivative, not a level): 1.0x fair share, rho = +1.00, no competence
      cost. Damage is compute misallocation, not capability loss (~0.005
      competence), which still matters given Part III section 10.

  - id: E1.5
    tier: L7
    claim: "per-layer R_t is cheap-but-not-free at depth"
    source: "Part II section A"
    rig: B
    kill: "not a kill - measures wall-clock/memory, and the buffer size below which the spectrum is too noisy to threshold (feeds E1.1)"
    predicted: uncertain
    status: untested

  # -- Root 2 - verification coverage and cost (binding) -------------------
  - id: E2.1
    tier: Assay
    claim: "probe harvesting turns the Assay from a content-production line into a sealing policy"
    source: "Part III section 5"
    rig: A
    kill: "any harvested T2 probe whose verified outcome traces to a T3 judge"
    predicted: FAIL
    predicted_reason: >
      Tier laundering. 'Resolves with a verified outcome' does not specify a
      tier, so a T3-judged outcome becomes a T2 probe by the act of freezing and
      hiding it. Follow-up matters more than the kill: measure what fraction of
      traffic survives a strict T0/T1-only filter. If small, harvesting
      supplements the domains that already have verifiers and does nothing for
      the T3 domains that need them - meaning it does not attack the binding
      constraint at all.
    status: FAIL
    result: results/e2_1_tier_laundering.json
    finding: >
      H1 fails: under the policy as written, with no tier filter, 29-63% of the
      harvested "T2" suite is T3-adjudicated judge opinion, rising with the
      correlation between checkability and easiness. Cheap to fix with an
      explicit tier filter, but the policy as stated does not have one.
      H3 fails at high correlation: mean per-domain difficulty bias reaches
      0.095 at correlation 0.75 and 0.176 at 1.0, so the harvested suite tests
      each domain's easy corner while reporting coverage of the domain.
    prediction_wrong: >
      H2 PASSES, contradicting this plan's own pre-registered follow-up. A
      strict T0/T1 filter yields 33-68% of traffic and covers 94-97% of traffic
      mass - not the small fraction predicted. So the claim that "harvesting
      supplements only domains that already have verifiers and does nothing for
      the T3 domains" is NOT supported. Harvesting is viable as a suite source;
      its problem is representativeness, not yield.
    key_caveat: >
      The correlation between checkability and easiness is SWEPT, not measured,
      and the per-domain checkability profile is an assumption stated in the
      source. What this establishes is the shape of the damage as a function of
      that correlation, and which regime harvesting requires. Locating real
      traffic on that curve is Rig B work and is the thing that decides whether
      Part III section 5's optimism is warranted.

  - id: E2.2
    tier: Assay
    claim: "verifier synthesis moves a domain from T3 to T1 via the discovery/verification asymmetry"
    source: "Part III section 9 - declared highest-leverage item"
    rig: manual then B
    kill: "synthesized verifier disagrees with held-out human labels, or fails to reject known-bad cases the base judge accepted"
    predicted: uncertain
    note: "Part III's own roadmap item 6 says do this by hand on one domain before building machinery. Follow that."
    status: untested

  - id: E2.3
