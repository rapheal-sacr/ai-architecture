      region. It cannot reach anisotropy WITHIN a region - practised in some
      directions, unprobed in others - because the region is sampled as a unit.
      The obvious response, partition more finely so within-region variation
      becomes between-region, walks straight into E3.3's atomisation result. So
      partitioning cannot solve it at ANY grain: coarse hides the anisotropy,
      fine destroys the transfer structure, and no middle setting does both.
      That leaves exactly one instrument that does not depend on a partition:
      predicted variance against realized error on held-out queries. This is it.
      After the weighting rule it is the only measurement left that can catch the
      residual failure mode, so it goes FIRST in the Rig B block rather than
      being one of five.

