      GATE being broken. Measured, they track: mean gap +0.026, max +0.061, and
      rho(cheap, full) falls to 0.322 alongside rho(cheap, true) at 0.361. So the
      ladder finding is NOT the gate objective in disguise and E2.3 retains an
      independent result. Worth recording because the hypothesis was reasonable
      and the data does not support it.
    my_prediction_was_wrong_and_the_control_caught_it: >
      This experiment predicted the concentration would come from a
      traffic-weighted cheap rung - the weighting rule arriving at the Assay. It
      does not. `ladder_random`, the unbiased control with uniform probe
      allocation, concentrates at exactly the same 2.81x. The docstring
      pre-registered this contingency ("if BOTH arms concentrate, the effect is
      the ladder itself rather than the weighting, and the repair is different"),
      which is the only reason the wrong prediction did not become the finding.
    the_actual_mechanism: >
      A cheap rung ranks candidates by a MEAN over the regions it covered. A
      generalist at +0.04 across 16 regions scores 0.040; a rare specialist at
      +0.30 in one region scores 0.019. The specialist loses by more than half on
      ANY suite - uniformly sampled or traffic-weighted, noisy or exact - because
      probe allocation never enters the comparison. Ranking by a mean discards
      specialists structurally.
      So this is NOT a weighting-rule site. It is the filter statistic being the
      wrong shape for the objective the gate is meant to serve, and the weighting
      rule does not reach it.
    why_the_objective_had_to_be_named: >
      Under the design's gate as written - unweighted mean of per-region deltas -
      dropping a rare specialist is CORRECT, not a defect, since it is worth half
      a generalist. The loss is only a defect under I11's coverage objective,
      where a specialist lifting a region above the competence floor is exactly
      what closes the gap. The design never says which objective promotion
      serves, and until it does, "the ladder loses good candidates" is not even
      well posed.
    separate_finding_not_about_the_ladder: >
      Regret under the coverage objective is near-constant across every ladder
      setting, because the final pick is made on the full suite's MEAN score. That
      regret is a property of the GATE's objective, not of the ladder. Reported
      so it is not mistaken for one.

