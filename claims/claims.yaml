  - id: E1.4
    tier: L8
    claim: "L4's RLS error covariance is already an epistemic gap detector"
    source: "Part I section 3; Part II section A reading 2"
    rig: A
    kill: "noise regions capture > 3x fair share of practice budget (A1); or gate signal rho < 0.5 vs realized error (A2)"
    predicted: FAIL
    status: FAIL
    result: results/e1_4_aleatoric_magnet.json
    finding: >
      Posterior variance is epistemic + aleatoric and the two readings need
      opposite quantities. Predictive reading: one coin-flip region in twelve
      takes 51% of the practice budget (6.2x fair share), rising with horizon -
      an absorbing state, because 4p(1-p) peaks at p=0.5 where a coin flip
      lives permanently. Part III section 6.3's per-source cap only reduces
      this to 4.1x. Epistemic reading fixes the magnet but inverts the gate to
      rho = -0.99. Fix that passes both - score gaps by reducible variance
      (a derivative, not a level): 1.0x fair share, rho = +1.00, no competence
      cost. Damage is compute misallocation, not capability loss (~0.005
      competence), which still matters given Part III section 10.

